name: Technology source watch

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:technology
      - run: npm run watch:technology
      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          if [ -f technology/reports/watch.md ]; then
            cat technology/reports/watch.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-source-review
          path: technology/reports/
          if-no-files-found: warn
          retention-days: 30
