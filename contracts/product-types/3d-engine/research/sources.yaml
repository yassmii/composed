schema_version: "0.1"
research_status: initial
candidate_products:
  - Godot
  - Unity
  - Unreal Engine
  - Blender
  - MCP for Blender (community project)
  - MCP for Unity (community project)
  - OpenUSD
  - NVIDIA Omni Replicator
  - Khronos Vulkan Samples (measurement reference only)
  - Khronos glTF material specification (semantic reference, not mandated interchange)
source_selection:
  - Use official documentation, source repositories, or first-party technical material.
  - Record the product version and retrieval date for every source.
  - Review resource destruction, frame scheduling and no-display rendering across three engines;
    preserve counterexamples and historical source records.
  - "Second pass: compare agent workflows and reversible edits, annotated visual feedback and
    published evaluation methods. Community project sources are primary for their own projects, not
    vendor endorsements or measured superiority."
  - "Performance pass: six official documents about bottlenecks, delayed timings/readback, warmup,
    profiling overhead and timestamp validity. API-specific mechanisms are evidence, not
    implementation requirements."
  - "Rendering pass: ten primary documents on programmable shaders, PBR/colour, renderer feature
    differences, shader variants, GI, temporal reconstruction, virtualised geometry and compute.
    Technique names do not select an engine, API or mandatory hardware tier."
