  - clause: REQ-3D-015
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-014
      - OBS-3D-019
      - OBS-3D-021
    note: "Batching and contextual operations do not imply transactional rollback. Whole-set validation,
      property preview and stale-revision protection are stronger explicit product choices. USD
      overrides motivate preserving unaffected work without prescribing USD. Rendering pass:
      material/program/profile reference-state coverage and diagnostic/history semantics are
      explicit extensions; not claims of byte-identical images across platforms."
  - clause: REQ-3D-016
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-017
      - OBS-3D-021
    note: "Source preservation and advice to save motivate recovery. A bounded in-session checkpoint,
      seeded-state restoration and current-boundary revalidation are chosen guarantees, not evidence
      that all comparators expose them. Rendering pass: material/program/profile reference-state
      coverage and diagnostic/history semantics are explicit extensions; not claims of
      byte-identical images across platforms."
  - clause: REQ-3D-017
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-016
      - OBS-3D-020
      - OBS-3D-022
      - OBS-3D-023
    note: "Multi-view feedback and depth/segmentation outputs are observed in distinct systems. Stable
      node mapping, exact revision alignment, unlabelled opaque coverage and shared budgets are
      stricter choices; debug renderer IDs are not assumed stable. Rendering pass:
      material/program/profile reference-state coverage and diagnostic/history semantics are
      explicit extensions; not claims of byte-identical images across platforms."
