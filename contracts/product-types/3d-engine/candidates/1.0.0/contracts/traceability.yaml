  - clause: POL-3D-001
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-010
      - OBS-3D-011
    note: Godot documents a default 60Hz physics tick and Unity a configurable catch-up bound. The
      five-step cap and dropped whole-step lag are choices, not validated performance thresholds.
