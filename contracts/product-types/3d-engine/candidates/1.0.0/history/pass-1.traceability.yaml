  - clause: REQ-3D-014
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-005
      - OBS-3D-006
      - OBS-3D-007
      - OBS-3D-008
      - OBS-3D-009
    note: Deferred destruction and distinct detach/unload semantics motivate separating logical closure
      from reclamation. Late-result rejection, repeated closure, shared allocation accounting and
      cleanup observability remain explicit choices.
