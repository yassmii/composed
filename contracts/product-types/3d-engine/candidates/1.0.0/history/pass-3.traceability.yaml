  - clause: REQ-3D-015
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-014
      - OBS-3D-019
      - OBS-3D-021
    note: Batching and contextual operations do not imply transactional rollback. Whole-set validation,
      property preview and stale-revision protection are stronger explicit product choices. USD
      overrides motivate preserving unaffected work without prescribing USD.
  - clause: REQ-3D-016
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-017
      - OBS-3D-021
    note: Source preservation and advice to save motivate recovery. A bounded in-session checkpoint,
      seeded-state restoration and current-boundary revalidation are chosen guarantees, not evidence
      that all comparators expose them.
  - clause: REQ-3D-017
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-016
      - OBS-3D-020
      - OBS-3D-022
      - OBS-3D-023
    note: Multi-view feedback and depth/segmentation outputs are observed in distinct systems. Stable
      node mapping, exact revision alignment, unlabelled opaque coverage and shared budgets are
      stricter choices; debug renderer IDs are not assumed stable.
  - clause: POL-3D-003
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-024
      - OBS-3D-025
      - OBS-3D-026
    note: Published evaluation separates execution, geometry, views, rubrics and compute allocation. The
      comparison publication/claim rule is our choice; no published model ranking is transferred to
      Composed.
  - clause: QA-3D-004
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-024
      - OBS-3D-025
      - OBS-3D-026
    note: Metric separation and generation/verification budgets are research-supported patterns; the
      chosen task population, controls and pass rules remain explicit and unmeasured.
