  - clause: REQ-3D-018
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-029
    note: Readback can be asynchronous yet slow; bounded admission, control responsiveness and
      deadline/late-publication semantics are chosen guarantees, not demonstrated vendor
      convergence.
  - clause: REQ-3D-019
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-027
      - OBS-3D-028
      - OBS-3D-029
      - OBS-3D-030
      - OBS-3D-032
      - OBS-3D-033
    note: CPU/GPU independence, delayed readback/timing, profiling effects and query availability
      motivate valid correlated measurements. Exposed lifecycle records, retention and monotonic
      end-to-end timing are our choices; no graphics API is prescribed.
  - clause: QA-3D-005
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-028
      - OBS-3D-029
      - OBS-3D-031
    note: Asynchronous work and prewarming do not establish ready-result latency. Required finite
      per-envelope budgets, censored-result disclosure and percentile/max reporting are deliberate
      and unmeasured.
  - clause: QA-3D-006
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-008
      - OBS-3D-009
      - OBS-3D-031
    note: Reclamation differs from logical closure and prewarming can consume memory; load sweeps,
      bounded caches and recovery evidence are chosen tests, not a claimed scalability result.
  - clause: POL-3D-004
    basis: supported_pattern_and_choice
    observations:
      - OBS-3D-027
      - OBS-3D-028
      - OBS-3D-030
      - OBS-3D-031
    note: Hardware, availability, instrumentation and cold state affect observations. Frozen
      quality/load profiles and restrictions on performance claims are explicit choices.
