schema_version: "0.1"
research_status: "initial"
candidate_products: ["AIOS", "OpenHands", "Model Context Protocol"]
source_selection:
  - "AIOS is the primary reference because it is the only candidate designed and described as an operating system for LLM agents. It was read from a local clone of https://github.com/agiresearch/AIOS at the commit recorded as each AIOS repository source version, and from the versioned arXiv paper 2403.16971v5 (COLM 2025)."
  - "The AIOS repository at that commit has no licence file; it is used as read-only evidence and paraphrased only."
  - "OpenHands is the comparison reference for agent execution, read from its official documentation repository https://github.com/OpenHands/docs at the commit recorded as each OpenHands source version."
  - "The Model Context Protocol specification, revision 2026-07-28, is the reference for the tool boundary, read from https://github.com/modelcontextprotocol/modelcontextprotocol at the commit recorded as each MCP source version. It is a protocol, not an agent operating system."
  - "Every url is immutable: a raw file pinned to its commit, or a versioned arXiv PDF. content_sha256 is the SHA-256 of the bytes served at that url. The locator names the path, the rendered page where one exists, and the sections used."
  - "Letta (letta-ai/letta) was examined and excluded because its repository at the inspected commit carries no product documentation beyond a one-line claim."
