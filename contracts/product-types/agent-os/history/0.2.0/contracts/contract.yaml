schema_version: "0.1"
id: "agent-os"
name: "Agent Operating System"
version: "0.2.0"
kind: "product-contract"
status: "draft"
license: "CC-BY-4.0"

intent:
  promise: "Let people run AI agents as managed processes that share models, memory, storage, and tools under explicit permissions, with a human able to stop any consequential action."
  primary_outcome: "Every agent action passes one mediation boundary that checks it against granted capabilities, asks for human confirmation when the policy requires it, isolates its execution, and records it."
  success_metrics:
    - id: "MET-AOS-001"
      measure: "100% of executed agent actions have an event naming the process, principal, capability used, policy decision, and result."
    - id: "MET-AOS-002"
      measure: "0 actions classified destructive, irreversible, privilege-changing, or unclassified execute without a recorded user approval or a standing grant covering them."
    - id: "MET-AOS-003"
      measure: "0 successful accesses outside granted scopes in the isolation and permission conformance suite."

scope:
  includes:
    - "Agent processes with a lifecycle: start, pause, resume, terminate, and recovery after a runtime failure"
    - "A single mediation boundary for model, memory, storage, tool, network, and secret access"
    - "Scheduling of shared model and tool resources between concurrent processes"
    - "Capability-based permissions granted by a human principal or operator"
    - "Risk classification and human confirmation of consequential actions"
    - "Isolated execution of agent-initiated code and commands"
    - "Scoped agent memory and context management"
    - "Secret handling, audit events, usage accounting, and budgets"
    - "Installation of versioned agent definitions that declare required capabilities"
  excludes:
    - "Hardware kernel, boot, device drivers, and CPU scheduling of the host (POL-AOS-001)"
    - "Model training or fine-tuning"
    - "A specific model provider, agent framework, or prompt format"
    - "Agent marketplace or distribution hub"
    - "Cross-device synchronisation of a user's agents and data"
    - "Desktop shell or graphical computer-use control"
    - "Billing and payment"
    - "Retention, archival, and legal erasure of event logs and memory"

actors:
  - id: "ACT-AOS-USER"
    name: "Principal"
    goals: ["Delegate tasks to agents", "Stay in control of what agents may do", "Approve or deny consequential actions"]
    permissions: ["Start, pause, resume, and terminate own processes", "Grant and revoke capabilities within operator policy", "Approve or deny actions of own processes"]
  - id: "ACT-AOS-OPERATOR"
    name: "Operator"
    goals: ["Run the agent OS safely for one or more principals", "Control cost and resource use"]
    permissions: ["Set system policy, isolation modes, trusted tool providers, and budgets", "Inspect processes, events, and usage", "Terminate any process", "Deny, but never approve, an action awaiting confirmation"]
  - id: "ACT-AOS-DEVELOPER"
    name: "Agent developer"
    goals: ["Package an agent that runs on any conforming agent OS"]
    permissions: ["Publish agent definitions that declare required capabilities"]
  - id: "ACT-AOS-AGENT"
    name: "Agent process"
    goals: ["Complete the delegated task"]
    permissions: ["Request operations through the mediation boundary within granted capabilities"]
  - id: "ACT-AOS-SYSTEM"
    name: "Agent OS runtime"
    goals: ["Keep every action authorised, isolated, recorded, and recoverable"]
    permissions: ["Mediate, schedule, and record every request", "Enforce permissions, confirmations, isolation, and budgets"]

domain:
  entities:
    - id: "ENT-AOS-DEFINITION"
      name: "Agent definition"
      description: "A versioned package that identifies an agent and declares the capabilities and tools it requires."
      lifecycle: ["published", "installed", "uninstalled"]
    - id: "ENT-AOS-PROCESS"
      name: "Agent process"
      description: "One running instance of an agent definition version on behalf of exactly one principal."
      lifecycle: ["created", "running", "awaiting_confirmation", "paused", "completed", "failed", "terminated"]
    - id: "ENT-AOS-REQUEST"
      name: "Operation request"
      description: "One mediated request from a process to use a model, memory, storage, tool, network destination, or secret."
      lifecycle: ["received", "validated", "awaiting_confirmation", "queued", "executing", "succeeded", "failed", "denied", "indeterminate"]
    - id: "ENT-AOS-GRANT"
      name: "Capability grant"
      description: "A permission for one process or agent definition to use one resource kind within a scope, optionally with limits and an expiry."
      lifecycle: ["granted", "revoked", "expired"]
    - id: "ENT-AOS-MEMORY"
      name: "Memory item"
      description: "A piece of agent memory scoped to one principal and one owner agent, with a private or shared visibility."
      lifecycle: ["active", "offloaded", "deleted"]
    - id: "ENT-AOS-SANDBOX"
      name: "Sandbox"
      description: "The isolation boundary in which a process's code and commands run."
      lifecycle: ["provisioned", "active", "destroyed"]
    - id: "ENT-AOS-EVENT"
      name: "Event"
      description: "An immutable, timestamped record of a request, decision, confirmation, result, state change, or compaction."
      lifecycle: ["recorded"]
    - id: "ENT-AOS-BUDGET"
      name: "Budget"
      description: "A limit on model usage, spend, tool calls, or wall-clock time for a principal or a process."
      lifecycle: ["active", "exhausted", "renewed"]
  glossary:
    - term: "principal"
      definition: "The human on whose behalf a process runs and to whom its grants, memory, and confirmations belong."
    - term: "mediation boundary"
      definition: "The single runtime interface through which a process reaches any resource; there is no other path."
    - term: "capability"
      definition: "The right to use one resource kind (a model, memory scope, storage scope, tool, network destination, or secret) within a scope."
    - term: "risk class"
      definition: "One of read_only, modifying, destructive, irreversible, privilege_changing, or unclassified, assigned to an action by the runtime's policy."
    - term: "standing grant"
      definition: "A principal's prior approval of one tool within one scope and risk class, which replaces per-action confirmation until revoked or expired."
    - term: "trusted tool provider"
      definition: "A tool provider the operator has declared trusted, whose behaviour metadata the runtime may use to lower an action's risk class."
    - term: "consequential action"
      definition: "An action whose risk class is destructive, irreversible, privilege_changing, or unclassified."
    - term: "started executing"
      definition: "A request has started executing once the runtime has durably recorded its entry into execution, which happens before the target is invoked."
    - term: "secret-bearing output"
      definition: "Any output of an execution that received a secret value, whether or not the value is recognisable in it."
    - term: "reference workload"
      definition: "A versioned workload that each implementation defines and publishes with its conformance evidence; it exercises every must capability and runs at least four concurrent processes."
    - term: "reference hardware"
      definition: "The machine configuration (processor, memory, storage, operating system, and isolation provider) that each implementation documents and publishes with the measurements taken on it."

capabilities:
  - id: "CAP-AOS-001"
    name: "Run agents as managed processes"
    priority: "must"
    actor: "ACT-AOS-USER"
    outcome: "A principal starts, observes, pauses, resumes, and stops agents, and nothing is lost or repeated when the runtime fails."
    requirements:
      - id: "REQ-AOS-001"
        statement: "Every process has a stable identifier, one principal, one agent definition version, and exactly one lifecycle state at a time."
      - id: "REQ-AOS-002"
        statement: "A principal can pause, resume, or terminate their own processes and an operator can terminate any process; a pause takes effect before the process's next request starts executing, and resuming continues from the recorded state without re-executing completed requests."
      - id: "REQ-AOS-003"
        statement: "After an unexpected runtime stop, every process that was not in a final state is restored as paused with its full event history; a request that had started executing and whose outcome was not recorded is marked indeterminate and is never retried automatically; a request that had not started executing is marked failed as not executed and is never executed automatically."
  - id: "CAP-AOS-002"
    name: "Mediate every operation"
    priority: "must"
    actor: "ACT-AOS-SYSTEM"
    outcome: "Every resource use by an agent goes through one boundary that validates, authorises, and records it."
    requirements:
      - id: "REQ-AOS-004"
        statement: "A process reaches models, memory, storage, tools, network destinations, and secrets only through operation requests to the mediation boundary."
      - id: "REQ-AOS-005"
        statement: "Each request is validated against the declared input schema of its target before execution; an invalid request is not executed and the process receives an error that names each failing input."
      - id: "REQ-AOS-006"
        statement: "Each request has a time limit; when it is exceeded, the process receives a timeout error and the event records whether the target may have partly executed."
  - id: "CAP-AOS-003"
    name: "Schedule shared resources"
    priority: "must"
    actor: "ACT-AOS-SYSTEM"
    outcome: "Concurrent processes share models and tools predictably, and no process can starve the others."
    requirements:
      - id: "REQ-AOS-007"
        statement: "Requests for shared model and tool resources are queued by the runtime under a documented scheduling policy; no single request can hold a shared model resource beyond a documented limit while other requests wait."
      - id: "REQ-AOS-008"
        statement: "The runtime never exceeds a tool's declared concurrency limit; a request that would exceed it waits while other eligible requests proceed."
      - id: "REQ-AOS-009"
        statement: "A model request suspended by the scheduler resumes from saved state, and the process receives one complete response per request."
  - id: "CAP-AOS-004"
    name: "Enforce capability-based permissions"
    priority: "must"
    actor: "ACT-AOS-SYSTEM"
    outcome: "A process can do only what its principal, within operator policy, explicitly allowed."
    requirements:
      - id: "REQ-AOS-010"
        statement: "A process holds only the capabilities granted to it or to its agent definition by its principal within operator policy; a request without a matching grant is denied. The single exception is that a process can always read its own event history; this access cannot be widened, delegated, or extended to another process."
      - id: "REQ-AOS-011"
        statement: "A process can read or write another process's memory or storage only through a grant that names that scope; processes of different principals never share a grant."
      - id: "REQ-AOS-012"
        statement: "Permission checks are made by the runtime for every request at the mediation boundary, whatever the agent, its model output, or tool metadata claims."
      - id: "REQ-AOS-013"
        statement: "No process can create, widen, or extend a grant for itself or another process; changing grants is a principal or operator action."
  - id: "CAP-AOS-005"
    name: "Confirm consequential actions with a human"
    priority: "must"
    actor: "ACT-AOS-USER"
    outcome: "A principal sees and decides every consequential action before it takes effect."
    requirements:
      - id: "REQ-AOS-014"
        statement: "The runtime assigns every action a risk class from its own policy. The agent's self-assessment and the metadata of a tool provider that is not trusted can raise the class but never lower it; an action the policy cannot classify is unclassified."
      - id: "REQ-AOS-015"
        statement: "A consequential action moves its process to awaiting_confirmation and executes only after the principal approves it, unless a standing grant covers that tool, scope, and risk class; a principal can require confirmation for further risk classes."
      - id: "REQ-AOS-016"
        statement: "A confirmation request shows the action, its inputs with secret values masked, the resources it targets, its risk class, and the reason confirmation is required."
      - id: "REQ-AOS-017"
        statement: "A denied action is not executed; the process receives a rejection result and can continue or stop."
      - id: "REQ-AOS-018"
        statement: "An approval applies only to the exact action and inputs presented; any change to them requires a new confirmation."
      - id: "REQ-AOS-032"
        statement: "Only the principal of a process can approve its actions; no delegation of approval exists in this core. An operator can deny a pending action or terminate the process, but never approve it."
  - id: "CAP-AOS-006"
    name: "Isolate agent execution"
    priority: "must"
    actor: "ACT-AOS-SYSTEM"
    outcome: "Agent-initiated code and commands cannot reach anything outside their granted scopes."
    requirements:
      - id: "REQ-AOS-019"
        statement: "Code and commands initiated by a process run inside a sandbox that limits file, process, and network access to the process's granted scopes."
      - id: "REQ-AOS-020"
        statement: "A reduced-isolation mode can be enabled only by an operator; processes running under it are marked as such in every status view and event."
  - id: "CAP-AOS-007"
    name: "Manage scoped memory and context"
    priority: "must"
    actor: "ACT-AOS-AGENT"
    outcome: "Agents keep useful memory and fit within model limits without leaking or losing information."
    requirements:
      - id: "REQ-AOS-021"
        statement: "Every memory item is scoped to one principal and one owner agent; a private item is visible only to its owner agent, a shared item to the agents of the same principal, and an item with a missing or non-matching principal is not returned."
      - id: "REQ-AOS-022"
        statement: "A read returns every memory write of the same principal accepted before it, or reports to the process that the result may be incomplete."
      - id: "REQ-AOS-023"
        statement: "When a process's context exceeds a model's limit, the runtime compacts older history into a summary, records which events were summarised, and keeps the original events in the log."
      - id: "REQ-AOS-024"
        statement: "Memory beyond a process's working allocation is moved to persistent storage and remains retrievable; it is never dropped silently."
  - id: "CAP-AOS-008"
    name: "Protect secrets"
    priority: "must"
    actor: "ACT-AOS-SYSTEM"
    outcome: "Agents can use credentials without models, logs, or users seeing their values."
    requirements:
      - id: "REQ-AOS-025"
        statement: "A secret is supplied only to a process holding a grant for it, at the point of use inside the sandbox; its value is never placed in model input and is masked in outputs, events, and confirmation requests."
      - id: "REQ-AOS-031"
        statement: "The runtime marks every secret-bearing output; any part of it enters model input only after the principal approves that transfer, and the approval request shows the output with known secret encodings masked."
  - id: "CAP-AOS-009"
    name: "Audit and observe"
    priority: "must"
    actor: "ACT-AOS-OPERATOR"
    outcome: "An operator or principal can reconstruct what every agent did, why it was allowed, and what it cost."
    requirements:
      - id: "REQ-AOS-026"
        statement: "The runtime records an event for every request, permission decision, confirmation request and answer, result, error, state change, grant change, and compaction, with time, process, principal, and source."
      - id: "REQ-AOS-027"
        statement: "A principal can inspect the events and usage of their own processes, and an operator of any process; usage covers model tokens, model calls, tool calls, spend, and wall-clock time."
  - id: "CAP-AOS-010"
    name: "Enforce budgets"
    priority: "must"
    actor: "ACT-AOS-OPERATOR"
    outcome: "Agent work cannot exceed the cost and resources the operator or principal allowed."
    requirements:
      - id: "REQ-AOS-028"
        statement: "Budgets can be set per principal and per process; at 80%, 90%, and 100% of a budget the operator and principal are notified, and at 100% new consuming requests are refused and the process is paused with a budget-exhausted reason until the budget is raised or renewed."
  - id: "CAP-AOS-011"
    name: "Install versioned agent definitions"
    priority: "should"
    actor: "ACT-AOS-DEVELOPER"
    outcome: "An agent packaged once runs on any conforming agent OS with only the permissions it declared and the principal accepted."
    requirements:
      - id: "REQ-AOS-029"
        statement: "An agent definition declares its identity, version, tools, and required capabilities; installation shows them to the principal, and no grant exceeds what the definition declares."
      - id: "REQ-AOS-030"
        statement: "A running process keeps the definition version it started with; installing a newer version affects only processes started afterwards."

invariants:
  - id: "INV-AOS-001"
    statement: "No agent action reaches a resource without passing the mediation boundary, a permission check, and an event record."
    rationale: "Control, isolation, and audit all depend on there being no side path."
  - id: "INV-AOS-002"
    statement: "A process never holds a capability that its principal, within operator policy, did not grant."
    rationale: "Agents act on model output, which can be wrong or manipulated; privilege must not grow from inside."
  - id: "INV-AOS-003"
    statement: "No consequential action executes without a recorded approval by the principal or a standing grant that covers it."
    rationale: "Destructive, irreversible, and privilege-changing effects cannot be undone by inspecting a log afterwards."
  - id: "INV-AOS-004"
    statement: "Memory, storage, events, and secrets of one principal are never visible to another principal's processes."
    rationale: "One agent OS can serve several people, and agents can be prompted to exfiltrate data."
  - id: "INV-AOS-005"
    statement: "A secret value, or any encoding of it that the implementation declares it detects, never appears in model input, events, or user-facing output; secret-bearing output reaches model input only under REQ-AOS-031."
    rationale: "Model input and logs leave the secret's protection boundary. A program that receives a secret can transform it in ways no masking recognises, so the guarantee covers declared encodings, and the rest of the risk is controlled at the transfer to the model."
  - id: "INV-AOS-006"
    statement: "The event log of a process is append-only; pause, compaction, recovery, and denial add events and never remove or change earlier ones."
    rationale: "Audit and recovery are only trustworthy if history cannot be rewritten by ordinary operation."
  - id: "INV-AOS-007"
    statement: "Each operation request executes at most once."
    rationale: "Repeating a non-idempotent action after a failure or resume can cause the harm confirmation exists to prevent."

policies:
  - id: "POL-AOS-001"
    decision: "This product type defines an agent OS as an operating layer running on a host operating system; it is not a hardware kernel."
    consequence: "Boot, drivers, and host CPU scheduling are out of scope; the host OS and its isolation primitives are external dependencies."
  - id: "POL-AOS-002"
    decision: "Permissions are deny-by-default and granted per capability and scope."
    consequence: "A newly started process can do nothing beyond what its principal granted, except read its own event history (REQ-AOS-010), and missing scope information leads to denial."
  - id: "POL-AOS-003"
    decision: "By default, read_only actions and modifying actions within granted scopes run without confirmation; destructive, irreversible, privilege_changing, and unclassified actions require confirmation. A principal can tighten this; loosening it needs a standing grant per tool, scope, and risk class."
    consequence: "Confirmation is concentrated on effects that cannot be reversed, and convenience never silently widens beyond one named tool and scope."
  - id: "POL-AOS-004"
    decision: "The agent OS is neutral about model providers and tool protocols; models and tools are resources behind the mediation boundary."
    consequence: "Any hosted or local model and any tool protocol can be used if it is reached through mediated requests."
  - id: "POL-AOS-005"
    decision: "Risk is decided by the runtime's policy. An agent's self-assessment and untrusted tool metadata are advisory and can only raise risk."
    consequence: "A manipulated or mistaken agent cannot talk its way out of a confirmation."
  - id: "POL-AOS-006"
    decision: "Isolation is on by default; reduced isolation is an operator decision that stays visible."
    consequence: "A principal can always see whether a process runs with weaker isolation."

quality_attributes:
  - id: "QA-AOS-001"
    attribute: "controllability"
    target: "In the reference workload, 100% of pause and terminate requests take effect before the target process's next request starts executing."
  - id: "QA-AOS-002"
    attribute: "fairness"
    target: "With N processes of equal priority contending for one model resource, no request waits longer than N times the documented scheduling quantum plus one request's service time."
  - id: "QA-AOS-003"
    attribute: "auditability"
    target: "100% of executed requests in the reference workload have an event with process, principal, capability, decision, and result."
  - id: "QA-AOS-004"
    attribute: "recoverability"
    target: "After the runtime is killed during the reference workload, 100% of non-final processes are restored paused with complete event histories and 0 requests execute twice."
  - id: "QA-AOS-005"
    attribute: "isolation"
    target: "The documented escape and cross-principal test suite reports 0 successful accesses outside granted scopes."
  - id: "QA-AOS-006"
    attribute: "mediation overhead"
    target: "On documented reference hardware, the median overhead the mediation boundary adds to a request, excluding model and tool execution time, is at most 50 ms."

integrations:
  - id: "INT-AOS-001"
    system: "Model providers (hosted or local)"
    purpose: "Serve inference requests from processes."
    degradation: "An unavailable model returns an error to the requesting process and is recorded; requests are switched to another model only if the operator configured that routing."
  - id: "INT-AOS-002"
    system: "Tool providers (any protocol)"
    purpose: "Execute tool actions on behalf of processes."
    degradation: "An unavailable or failing tool returns an error to the process; the request is not retried automatically unless the tool is declared idempotent by a trusted provider."
  - id: "INT-AOS-003"
    system: "Host operating system and isolation provider"
    purpose: "Provide the sandboxes in which agent code and commands run."
    degradation: "If the required isolation cannot be provided, processes that need it do not start and running ones are paused; the runtime never falls back to weaker isolation on its own."
  - id: "INT-AOS-004"
    system: "Identity provider"
    purpose: "Authenticate principals and operators."
    degradation: "Without authentication no process can be started, approved, or inspected; running processes needing confirmation stay in awaiting_confirmation."

acceptance:
  - id: "ACC-AOS-001"
    given: "A process granted read access to one storage scope only."
    when: "It requests a write to that scope and a read of another scope, including through a path that bypasses the user interface."
    then: "Both requests are denied, nothing is written or returned, and two denial events are recorded."
    evidence: "Permission-boundary test."
  - id: "ACC-AOS-002"
    given: "A process with a granted delete-capable tool and the default confirmation policy."
    when: "The agent requests a file deletion and labels it low risk."
    then: "The action is classified destructive, the process moves to awaiting_confirmation, and nothing is deleted before approval."
    evidence: "Risk-override confirmation test."
  - id: "ACC-AOS-003"
    given: "A process awaiting confirmation of an action."
    when: "The principal denies it."
    then: "The action never executes, the process receives a rejection result, and the denial is recorded with the principal and time."
    evidence: "Confirmation-denial test."
  - id: "ACC-AOS-004"
    given: "An approved action."
    when: "The process changes one input before execution."
    then: "The changed action is not executed until it is confirmed again."
    evidence: "Approval-binding test."
  - id: "ACC-AOS-005"
    given: "A tool from a provider that is not trusted, annotated as read-only, that deletes data."
    when: "A process calls it."
    then: "The annotation does not lower the risk class; the call is treated as unclassified and requires confirmation."
    evidence: "Untrusted-metadata test."
  - id: "ACC-AOS-006"
    given: "A running process."
    when: "The principal pauses it while a model request is executing, then resumes it."
    then: "No new request starts while paused, and after resuming no completed request is executed again."
    evidence: "Pause-resume test meeting QA-AOS-001."
  - id: "ACC-AOS-007"
    given: "Several processes mid-task, one with a tool call executing and another with a request queued but not started."
    when: "The runtime is killed and restarted."
    then: "All non-final processes are restored paused with full histories; the in-flight tool call is marked indeterminate and not retried; the queued request is marked failed as not executed and never runs; each restored process can read its own history but not another's."
    evidence: "Crash-recovery test meeting QA-AOS-004."
  - id: "ACC-AOS-008"
    given: "Two principals each running an agent that writes shared and private memory."
    when: "Each agent reads memory, and one item is stored without a principal."
    then: "Each agent sees only its own principal's shared items and its own private items; the unscoped item is returned to no one."
    evidence: "Memory-isolation test."
  - id: "ACC-AOS-009"
    given: "A process granted one secret."
    when: "It runs a command that prints the secret and later requests a model call that includes the command output."
    then: "The command receives the value, but the output, the events, and the model input show only a masked value."
    evidence: "Secret-masking test."
  - id: "ACC-AOS-010"
    given: "A process whose sandbox grants access to one directory and no network."
    when: "Its code reads a file outside that directory and opens a network connection."
    then: "Both attempts fail and are recorded."
    evidence: "Sandbox-escape test meeting QA-AOS-005."
  - id: "ACC-AOS-011"
    given: "A process with a budget of 1,000 model tokens."
    when: "Its usage reaches 80%, 90%, and then 100%."
    then: "Notifications are sent at each threshold, and at 100% the next model request is refused and the process pauses with a budget-exhausted reason."
    evidence: "Budget-enforcement test."
  - id: "ACC-AOS-012"
    given: "A process whose history exceeds the model's context limit."
    when: "It makes its next model request."
    then: "The request uses a compacted context, a compaction event names the summarised events, and the original events remain readable in the log."
    evidence: "Context-compaction test."
  - id: "ACC-AOS-013"
    given: "Four processes of equal priority sending long model requests to one model resource."
    when: "They run concurrently."
    then: "Every request is served within the QA-AOS-002 bound, and each process receives one complete response per request."
    evidence: "Scheduling-fairness test."
  - id: "ACC-AOS-014"
    given: "A tool declared with a concurrency limit of one."
    when: "Two processes request it at the same time while a third requests another tool."
    then: "Only one call to the limited tool executes at a time, and the third process's request is not blocked by the wait."
    evidence: "Tool-concurrency test."
  - id: "ACC-AOS-015"
    given: "A running process."
    when: "The agent asks the runtime to grant itself a new tool capability."
    then: "The request is denied, no grant changes, and the attempt is recorded."
    evidence: "Self-escalation test."
  - id: "ACC-AOS-016"
    given: "A host on which the required sandbox cannot be provisioned."
    when: "A principal starts an agent."
    then: "The process does not start and the reason is reported; no process runs with weaker isolation unless an operator enabled it."
    evidence: "Isolation-degradation test."
  - id: "ACC-AOS-017"
    given: "A process granted one secret, running a command that prints the secret reversed."
    when: "The process requests a model call that includes that command's output."
    then: "The output is marked secret-bearing, the model call waits for the principal's approval, and nothing from the output reaches the model if the principal denies."
    evidence: "Secret-bearing-output test."
  - id: "ACC-AOS-018"
    given: "A process with an action awaiting confirmation."
    when: "An operator tries to approve it, then denies it."
    then: "The approval is refused and recorded; the denial is accepted, the action never executes, and the process receives a rejection result."
    evidence: "Confirmation-authority test."

delivery:
  required_artifacts: ["Mediation boundary and request reference", "Risk-classification policy and default confirmation matrix", "Capability and grant model", "Sandbox and isolation specification", "Event schema", "Conformance matrix"]
  verification: ["ACC-AOS-001 to ACC-AOS-018 tests", "Published reference workload and reference hardware description", "QA-AOS-002 fairness benchmark", "QA-AOS-005 escape suite", "QA-AOS-006 mediation-overhead benchmark"]

extensions:
  aos.computer-use: "Lets processes operate a graphical desktop inside a sandboxed virtual machine; every UI action still passes the mediation boundary and the confirmation policy."
  aos.multi-device: "Synchronises a principal's agents, memory, and grants across devices without weakening INV-AOS-004."
  aos.retention: "Defines retention, archival, and authorised erasure of events and memory, which INV-AOS-006 otherwise forbids."
