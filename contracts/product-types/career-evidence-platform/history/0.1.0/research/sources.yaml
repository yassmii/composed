candidate_products:
- Europass
- Teal
- FutureFit AI / Career Copilot
- Fuel50
- Xref
- Credly
source_selection:
- Official product documentation and standards were consulted on 2026-10-21. Commercial pages are vendor statements,
  not independent outcome measurements; this is not a hands-on product benchmark.
- Hashable primary sources below are downloaded page snapshots using the repository html_article_text normalization.
  Unversioned pages can change; retrieval hashes are not immutable archives.
- Teal import/export help and Credly Evidence were read through web retrieval but their raw endpoints returned HTTP
  403. They are qualitative comparison references only, excluded from machine-traced sources and clause evidence.
- Private interviews, project documents and stakeholder conversation inform the private project framing. They
  are not copied into this reusable unit or presented as public research.
- Standards inform semantics and interoperability without prescribing storage engines, programming languages, cloud
  vendors or a mandatory credential transport.
- Research papers are evidence of specific methods and datasets, not evidence that a method is universally superior
  or that this contract meets a global SOTA benchmark.
