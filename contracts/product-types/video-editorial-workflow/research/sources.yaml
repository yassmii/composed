source_selection:
  - "Frame.io V4 is studied for media review behaviours, timestamped comments and version comparison; it does not prescribe an integration or a provider to an implementation."
  - "Adobe Premiere provides a documented example of handoff; its formats and limits inform the acceptance check without imposing this product on the generic family."
  - "Nextcloud Desktop Client is studied for observable behaviours of local/remote synchronisation and conflict; it is not a storage or synchronisation recommendation."
