source_selection:
  - "Frame.io V4 est étudié pour les comportements de revue média, commentaires horodatés et comparaison de versions ; il ne prescrit pas une intégration ou un fournisseur à une implémentation."
  - "Adobe Premiere apporte un exemple documenté de handoff ; ses formats et limites éclairent la recette sans imposer ce produit à la famille générique."
  - "Nextcloud Desktop Client est étudié pour les comportements observables de synchronisation locale/distante et de conflit ; il ne constitue pas une recommandation de stockage ou de synchronisation."
