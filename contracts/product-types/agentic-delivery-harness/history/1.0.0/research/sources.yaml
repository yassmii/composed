source_selection:
- Primary documentation and source code inspected on 2026-10-24; no competitor benchmark or effectiveness
  claim is made.
- GitHub sources are pinned to exact revisions and hashed as served bytes. Claude Code documentation is
  mutable; its hash identifies only the retrieved body. W3C PROV-O is a dated recommendation used as a
  conceptual reference, not a mandatory technology.
- Local Composed 0.5.1 at 35e65065a3097c3a98513f3fa9e4e8f0ce499e62 is implementation context, recorded
  separately in baseline.json and baseline.md; the normative contract is not a copy of its mechanics.
- ECC source inspection distinguishes a blocking pre-command path from diagnostic post-edit checks. Documentation
  of a harness or learning system does not demonstrate its benefit.
- Continuous research, scoped telemetry, evidence-graph access rules and delivery authority include explicit
  design choices. No inspected product establishes the complete proposed system or universal SOTA status.
