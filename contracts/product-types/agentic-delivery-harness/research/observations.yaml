schema_version: '0.1'
observations:
- id: OBS-ADH-001
  sources:
  - SRC-ADH-SKILLS
  statement: Agent Skills describes a skill directory with metadata and instructions, optionally complemented
    by scripts, references and assets.
- id: OBS-ADH-002
  sources:
  - SRC-ADH-POCOCK
  statement: Matt Pocock presents his skills as small, adaptable and composable rather than a single imposed
    process.
- id: OBS-ADH-003
  sources:
  - SRC-ADH-POCOCK
  statement: The configuration proposed by Matt Pocock collects the choice of issue tracker, labels
    and location of documents; its questioning can produce a glossary and decisions.
- id: OBS-ADH-004
  sources:
  - SRC-ADH-SUPERPOWERS
  statement: Superpowers describes a progression from questioning to approved design, to the plan and then to
    delegated development after agreement.
- id: OBS-ADH-005
  sources:
  - SRC-ADH-SUPERPOWERS
  statement: Superpowers includes inspections and reviews of the agents' work in its development process.
- id: OBS-ADH-006
  sources:
  - SRC-ADH-SPECKIT
  statement: Spec Kit distinguishes several process entry points and offers extensions for the runtime's gates,
    services and events.
- id: OBS-ADH-007
  sources:
  - SRC-ADH-ECC-HOOK
  statement: The ECC pre-command dispatcher propagates the result of its check and returns a blocking code
    on truncated input or error.
- id: OBS-ADH-008
  sources:
  - SRC-ADH-ECC-QUALITY
  statement: The ECC quality-gate script runs targeted checks and reports some failures without itself
    converting them into a blocking exit.
- id: OBS-ADH-009
  sources:
  - SRC-ADH-ECC-EVAL
  statement: The ECC harness separates cost measurement from hidden-intent trials, and requires evaluators that
    distinguish correct references, the starting point and counter-examples.
- id: OBS-ADH-010
  sources:
  - SRC-ADH-ECC-GRADER
  statement: An ECC evaluator calls the delivered code and separately verifies timeout handling, the
    retry on refused connection and the attempt ceiling.
- id: OBS-ADH-011
  sources:
  - SRC-ADH-ECC-LEARNING
  statement: ECC describes learned rules with provenance, confidence and project scope, and a possible promotion
    to a global scope.
- id: OBS-ADH-012
  sources:
  - SRC-ADH-ECC-CONTRACT
  statement: The ECC contract-first skill coordinates consumers and providers around a canonical interface
    artifact and validations before integration.
- id: OBS-ADH-013
  sources:
  - SRC-ADH-CLAUDE-HOOKS
  statement: The Claude Code documentation distinguishes points before and after tools and task
    and subagent events; their decision powers differ.
- id: OBS-ADH-014
  sources:
  - SRC-ADH-PROV
  statement: PROV-O provides concepts of entity, activity, agent, attribution, derivation, revision and invalidation
    to express provenance.
- id: OBS-ADH-015
  sources:
  - SRC-ADH-ECC-EVAL
  statement: The ECC evaluation manifest fingerprints inputs and outputs; its documentation distinguishes this
    integrity from a signature or proof of the executor's identity.
- id: OBS-ADH-016
  sources:
  - SRC-ADH-SKILLS
  statement: Agent Skills describes progressive loading of metadata, instructions and then resources as
    they are needed.
- id: OBS-ADH-017
  sources:
    - SRC-ADH-CLAUDE-HOOKS
  statement: Claude Code documents FileChanged as an after-change event without decision control; PreToolUse applies only when Claude calls a tool.
- id: OBS-ADH-018
  sources:
    - SRC-ADH-CLAUDE-HOOKS
  statement: Claude Code documents that some SubagentStop events originate from internal agents, so that event name alone does not establish an explicitly delegated task.
