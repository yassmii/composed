schema_version: "0.1"
research_status: initial
candidate_products:
  - Attio
  - HubSpot
  - Pipedrive
  - Clay
  - Salesforce (qualitative reference)
  - Apollo (qualitative reference)
source_selection:
  - Documentary research of primary sources consulted on 2026-10-23; no hands-on comparative measurement
    of the products and no commercial validation carried out.
  - Vendor documentation establishes declared behaviours, not their effectiveness or legal
    compliance for the deployment envisaged. The thresholds of the contract are design choices.
  - The HTML contents below were retrieved and normalised with html_article_text from the common
    verifier; the PDFs are hashed on their raw bytes. The hashes are not immutable archives and
    unversioned pages can change.
  - Salesforce Trailhead and Apollo Buying Intent were read by web browsing. Their independent
    retrieval returned respectively an empty/challenge content and HTTP 403; they remain qualitative
    references in comparison.md, with no source identifier and no machine evidence chain.
  - The Notion material supplied and a private local repository constitute a private design context, documented without
    any copy of personal data or secrets in an unpublished scoping note. They are not presented as
    public sources verifiable by the common script.
  - The RNIC metadata was consulted; the complete national file, the contact details and the actual
    rights to contact were not verified. The source establishes no commercial need.
  - The CNIL reference framework (référentiel) is a recommendation of bounded scope, in particular excluding profiling from
    third-party sources; the more recent specific rules, including those for the telephone channel, must be
    verified separately.
  - The W3C formats, the OWASP controls and the Stripe examples inspire guarantees of provenance,
    accessibility and integrity without imposing a technology, a supplier or a payment integration.
