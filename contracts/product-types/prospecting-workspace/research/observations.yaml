schema_version: "0.1"
observations:
  - id: OBS-PR-001
    sources:
      - SRC-PR-ATTIO
    statement: Attio distinguishes the attributes of entities from the lists carrying the data specific to a process;
      views filter a representation without creating a new identity.
  - id: OBS-PR-002
    sources:
      - SRC-PR-ATTIO
    statement: Attio documents custom objects and relations between records; these possibilities
      depend on rights and product limits.
  - id: OBS-PR-003
    sources:
      - SRC-PR-HUBSPOT-SCORE
    statement: HubSpot distinguishes fit, engagement and combined scores, with separate results
      possible for each dimension.
  - id: OBS-PR-004
    sources:
      - SRC-PR-HUBSPOT-SCORE
    statement: HubSpot documents a time decay of event scores and retroactive re-evaluation
      when criteria change.
  - id: OBS-PR-005
    sources:
      - SRC-PR-PIPEDRIVE
    statement: Pipedrive keeps unqualified leads in an inbox distinct from the pipeline and then allows their
      conversion into deals.
  - id: OBS-PR-006
    sources:
      - SRC-PR-PIPEDRIVE
    statement: Pipedrive requires a lead to be linked to a person or organisation; this particular constraint does not
      on its own cover all the target types requested here.
  - id: OBS-PR-007
    sources:
      - SRC-PR-PIPEDRIVE
    statement: The Pipedrive lead detail view distinguishes upcoming activities, drafts and the history of completed activities.
  - id: OBS-PR-008
    sources:
      - SRC-PR-PIPEDRIVE-FORMS
    statement: Pipedrive documents customisable forms that can be shared or embedded in a website,
      feeding leads or deals.
  - id: OBS-PR-009
    sources:
      - SRC-PR-PIPEDRIVE-FORMS
    statement: Pipedrive states that its forms have no consent field by default and proposes
      configuring it as a custom field.
  - id: OBS-PR-010
    sources:
      - SRC-PR-CLAY
    statement: Clay allows a configurable succession of providers to enrich a type of data, with
      run conditions and an indication of the provider that returned the result.
  - id: OBS-PR-011
    sources:
      - SRC-PR-CLAY-SIGNALS
    statement: Clay documents the monitoring of changes from scheduled enrichments and a
      run history.
  - id: OBS-PR-012
    sources:
      - SRC-PR-HUBSPOT
    statement: HubSpot documents sequence exits after a reply or a meeting, with configurable triggers and
      scope.
  - id: OBS-PR-013
    sources:
      - SRC-PR-HUBSPOT
    statement: HubSpot states limits on the recognition of automatic replies depending on the mail service and
      recommends reviewing them.
  - id: OBS-PR-014
    sources:
      - SRC-PR-CNIL-COMM
    statement: The CNIL distinguishes promotional, transactional and relational purposes, as well as the
      conditions for electronic prospecting towards individuals and professionals.
  - id: OBS-PR-015
    sources:
      - SRC-PR-CNIL-FAQ
    statement: The CNIL recommends for prospects a retention of three years from collection or from the
      last contact coming from the prospect; its reference framework (référentiel) is non-binding and deviations must be
      justified.
  - id: OBS-PR-016
    sources:
      - SRC-PR-CNIL-REF
    statement: The CNIL reference framework (référentiel) excludes in particular certain profiling from third-party data and specifies that
      the mere opening of an email does not constitute a contact from the prospect that renews
      retention.
  - id: OBS-PR-017
    sources:
      - SRC-PR-CNIL-REUSE
    statement: The CNIL addresses the reuse of personal data published on the Internet by distinguishing
      lawfulness, notice, rights, processing by processors and risks; publication does not remove these
      obligations.
  - id: OBS-PR-018
    sources:
      - SRC-PR-CNIL-FAQ
    statement: The CNIL describes a suppression list (liste repoussoir) of minimal data reserved for managing the objection,
      to avoid a new solicitation after re-import.
  - id: OBS-PR-019
    sources:
      - SRC-PR-CNIL-PHONE
    statement: The CNIL page on canvassing (démarchage) mentions a change to the rules on telephone prospecting
      of consumers from 11 August 2026.
  - id: OBS-PR-020
    sources:
      - SRC-PR-STRIPE-IDEMPOTENCY
    statement: Stripe documents the reuse of a key to repeat a request without creating a second effect,
      with a consistency check on the parameters and a limited retention period for the key.
  - id: OBS-PR-021
    sources:
      - SRC-PR-STRIPE-EVENTS
    statement: Stripe documents the possibility of duplicated or out-of-order events, reconciliation by
      identifiers and verification of notification signatures.
  - id: OBS-PR-022
    sources:
      - SRC-PR-PROV
    statement: PROV-O distinguishes attribution, derivation, revision and invalidation of information.
  - id: OBS-PR-023
    sources:
      - SRC-PR-WCAG
    statement: WCAG 2.2 defines verifiable criteria for keyboard navigation, alternatives to dragging
      movements, adaptation of presentation and status messages.
  - id: OBS-PR-024
    sources:
      - SRC-PR-OWASP-AGENCY
    statement: OWASP identifies excessive functionality, permissions and autonomy as factors in damaging
      actions in applications based on language models.
  - id: OBS-PR-025
    sources:
      - SRC-PR-OWASP-INJECTION
    statement: OWASP describes indirect injection through retrieved content and the limits of prompt protections
      alone; reduced privileges and action controls limit its effects.
  - id: OBS-PR-026
    sources:
      - SRC-PR-GMAIL
    statement: Google distinguishes requirements for all senders and for bulk sending to personal Gmail
      accounts, in particular authentication, unsubscription and monitoring of complaints.
  - id: OBS-PR-027
    sources:
      - SRC-PR-RNIC
    statement: The ANAH page for the RNIC describes identification and composition data for co-owned buildings (copropriétés), with
      the name of the managing agent (syndic) where applicable, under Licence Ouverte 2.0.
  - id: OBS-PR-028
    sources:
      - SRC-PR-COPRO
    statement: Service Public distinguishes the co-owners' association (syndicat des copropriétaires), the professional or volunteer managing agent (syndic) and the co-owners' council (conseil
      syndical), with different functions.
  - id: OBS-PR-029
    sources:
      - SRC-PR-CNIL-FAQ
    statement: The CNIL recalls the notice about the source and the purpose in the case of indirect collection, with
      the applicable time limit and exceptions.
  - id: OBS-PR-030
    sources:
      - SRC-PR-RNIC
    statement: The RNIC page announces a daily update since April 2026 and possible variations in column names; this observation concerns the page and not an audit of the national file.
