schema_version: "0.1"
research_status: initial
candidate_products:
  - Attio
  - HubSpot
  - Pipedrive
  - Clay
  - Salesforce (référence qualitative)
  - Apollo (référence qualitative)
source_selection:
  - Recherche documentaire de sources primaires consultées le 2026-10-23; aucune mesure comparative pratique
    des produits ni validation commerciale effectuée.
  - Les documentations éditeurs établissent des comportements déclarés, pas leur efficacité ou une conformité
    juridique pour le déploiement envisagé. Les seuils du contrat sont des choix de conception.
  - Les contenus HTML ci-dessous ont été récupérés et normalisés avec html_article_text du vérificateur
    commun; les PDF sont hachés sur leurs octets bruts. Les empreintes ne sont pas des archives immuables et
    les pages non versionnées peuvent évoluer.
  - Salesforce Trailhead et Apollo Buying Intent ont été lus via navigation web. Leur récupération
    indépendante a respectivement retourné un contenu vide/challenge et HTTP 403; ils restent des références
    qualitatives dans comparison.md, sans identifiant de source ni chaîne de preuve machine.
  - Le Notion fourni et un dépôt local privé constituent un contexte privé de conception, documenté sans
    copie de données personnelles ni secrets dans une note de cadrage non publiée. Ils ne sont pas présentés comme des sources
    publiques vérifiables par le script commun.
  - Les métadonnées RNIC ont été consultées; le fichier national complet, les coordonnées et les droits
    effectifs de contact n’ont pas été vérifiés. La source n’établit pas de besoin commercial.
  - Le référentiel CNIL est une recommandation de portée délimitée, notamment hors profilage à partir de
    sources tierces; les règles spécifiques plus récentes, dont celles du canal téléphonique, doivent être
    vérifiées séparément.
  - Les formats W3C, les contrôles OWASP et les exemples Stripe inspirent des garanties de provenance,
    accessibilité et intégrité sans imposer de technologie, de fournisseur ou d’intégration de paiement.
