schema_version: "0.1"
research_status: "initial"
candidate_products: ["EmDash CMS", "Decap CMS", "TinaCMS"]
source_selection:
  - "EmDash CMS is the primary reference. It was inspected read-only from a clean local clone of https://github.com/emdash-cms/emdash (MIT licence) at the commit recorded as each EmDash source version."
  - "EmDash is database-backed; it is evidence for content-model, validation, draft, preview, revision, and permission behaviour, not for storage."
  - "Decap CMS and TinaCMS are Git-backed comparison references, read from their official documentation repositories at the commits recorded as each source version."
  - "Every url is an immutable raw file pinned to its commit; content_sha256 is the SHA-256 of the file bytes at that commit. The locator names the repository path, the rendered page, and the sections used."
  - "An unrelated project also named Emdash (github.com/generalaction/emdash, a coding-agent desktop app) was examined and excluded because it is not a CMS."
