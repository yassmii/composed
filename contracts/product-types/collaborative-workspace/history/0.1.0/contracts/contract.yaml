schema_version: "0.1"
id: "collaborative-workspace"
name: "Collaborative Workspace"
version: "0.1.0"
kind: "product-contract"
status: "draft"
license: "CC-BY-4.0"

intent:
  promise: "Give a team one free, Git-backed, and self-hostable place to turn ideas, knowledge, projects, and operational data into connected documents, databases, discussions, and repeatable workflows."
  primary_outcome: "An authorised participant can create, find, co-author, structure, discuss, automate, recover, and synchronise workspace information whose durable canonical history is portable Git data, without vendor lock-in, hidden paid gates, data exposure, or unauthorised structural change."
  success_metrics:
    - id: "MET-CWS-001"
      measure: "100% of accepted content, structure, permission, automation, integration, and export actions have an attributed event and result."
    - id: "MET-CWS-002"
      measure: "0 attempts to read, search, export, automate, or receive a notification about content outside an actor's effective scope succeed in the conformance suite."
    - id: "MET-CWS-003"
      measure: "100% of concurrent-edit, stale-write, restore, revocation, and automation-failure scenarios preserve an intelligible current state and an inspectable history."
    - id: "MET-CWS-004"
      measure: "100% of must capabilities conform on a documented self-hosted deployment without a vendor account, subscription, licence key, proprietary runtime, or mandatory outbound vendor connection."

scope:
  includes:
    - "Workspaces, private areas, teams, membership, groups, guests, ownership transfer, and organisation governance"
    - "A fully functional, reproducibly buildable and self-hostable core licensed for commercial and non-commercial use without a mandatory paid tier or vendor account"
    - "A Git repository as the canonical durable state and history for documents, structured records, schemas, views, templates, workflow definitions, policy declarations, attachment manifests, and materialised semantic changes"
    - "Local-first creation and editing, offline access to locally available content, encrypted synchronisation when configured, conflict-free or explicit-conflict merge, and optional peer-to-peer or self-hosted relay topologies"
    - "Nested rich documents composed from typed blocks, media, attachments, embeds, links, page mentions, synced content, templates, and reusable components"
    - "Live multi-participant editing, presence, cursors or selections, offline drafts, conflict disclosure, comments, reactions, mentions, reminders, and notifications"
    - "Databases whose items are rich pages; typed properties, validation, formulas, stable identifiers, relations, rollups, sub-items, dependencies, and task-oriented fields"
    - "Table, list, board, gallery, calendar, timeline, chart, map, form, detail, and dashboard presentations with filters, sorts, groups, calculations, saved personal views, and linked views"
    - "Search, navigation, backlinks, favourites, recents, labels, collections, recommendations, and an optional knowledge graph"
    - "Fine-grained authorisation, time-bounded shares, public publication, request-access workflow, data-classification labels, audit, retention, legal hold, backup, restore, import, and export"
    - "Rules, buttons, scheduled jobs, approvals, notifications, webhooks, integrations, API access, import and synchronisation"
    - "Optional AI assistance for drafting, summarising, extracting, answering from authorised sources, and proposing database or workflow changes"
  excludes:
    - "A mandated storage engine, editor engine, API protocol, hosting provider, identity provider, programming language, or client framework"
    - "Unsupervised external side effects by automations or AI agents"
    - "Requiring a proprietary vendor service, vendor-operated identity, licence key, subscription, telemetry, or remote model in order to exercise a must capability"
    - "Treating a cache, search index, collaboration relay, database projection, hosted Git forge, or client working copy as a second canonical content authority"
    - "A general-purpose accounting, payroll, messaging, video-conferencing, source-control, or file-system replacement"
    - "Irreversible erasure, e-discovery, region-specific residency, or regulated-record retention semantics without a separately versioned compliance extension"
    - "Guaranteeing that third-party embedded content, external search, or a connected application obeys this contract outside the granted integration boundary"

actors:
  - id: "ACT-CWS-MEMBER"
    name: "Member"
    goals: ["Create and organise knowledge", "Collaborate with colleagues", "Track and complete work"]
    permissions: ["Create content in granted spaces", "Read and change granted content", "Create personal views and notification preferences"]
  - id: "ACT-CWS-GUEST"
    name: "Guest"
    goals: ["Contribute to explicitly shared work", "Review or discuss selected information"]
    permissions: ["Use only explicitly granted resources", "Request additional access", "Comment or edit when the grant permits it"]
  - id: "ACT-CWS-STEWARD"
    name: "Content steward"
    goals: ["Maintain a trustworthy shared information model", "Publish reusable workflows and templates"]
    permissions: ["Manage granted content structure", "Publish views, forms, templates, and automations within policy", "Review activity in owned scopes"]
  - id: "ACT-CWS-OWNER"
    name: "Workspace owner"
    goals: ["Govern membership, security, retention, integrations, and billing-neutral workspace settings"]
    permissions: ["Manage workspace policy and ownership", "Suspend members and integrations", "Inspect audit and governance evidence"]
  - id: "ACT-CWS-ADMIN"
    name: "Organisation administrator"
    goals: ["Apply organisation-wide identity, security, and compliance policy"]
    permissions: ["Set organisation policy", "Manage managed workspaces", "Place or release legal holds when authorised"]
  - id: "ACT-CWS-INTEGRATION"
    name: "Integration identity"
    goals: ["Read or change explicitly connected workspace data", "Deliver subscribed events"]
    permissions: ["Act only through assigned scopes and declared capabilities"]
  - id: "ACT-CWS-AUTOMATION"
    name: "Automation or assistant identity"
    goals: ["Perform a declared workflow or assist an authorised participant"]
    permissions: ["Read, write, notify, or call integrations only within its versioned grant and policy"]

domain:
  entities:
    - id: "ENT-CWS-WORKSPACE"
      name: "Workspace"
      description: "An isolated collaboration boundary with members, policy, content, integrations, and an owner."
      lifecycle: ["provisioned", "active", "suspended", "archived", "deleted"]
    - id: "ENT-CWS-ACCOUNT"
      name: "Account"
      description: "A stable human identity, its verification state, lifecycle, authenticators, recovery methods, devices, and workspace memberships; it is distinct from a content author label."
      lifecycle: ["invited", "active", "suspended", "deprovisioned", "deleted"]
    - id: "ENT-CWS-AUTHENTICATOR"
      name: "Authenticator"
      description: "A user-controlled or externally verified authentication factor with a type, assurance properties, registration evidence, last-use metadata, and revocation state; secret material is never represented as workspace content."
      lifecycle: ["pending", "active", "lost", "revoked", "replaced"]
    - id: "ENT-CWS-SESSION"
      name: "Session"
      description: "A time-bounded, revocable authenticated interaction bound to an account, client or device context, assurance level, scopes, issue time, inactivity expiry, absolute expiry, and security events."
      lifecycle: ["pending", "active", "reauthentication_required", "expired", "revoked", "terminated"]
    - id: "ENT-CWS-RECOVERY"
      name: "Recovery method"
      description: "A pre-registered, policy-governed way to recover an account or replace an authenticator, with proof, delay, notification, revocation, and audit state."
      lifecycle: ["pending", "active", "used", "expired", "revoked"]
    - id: "ENT-CWS-DEPLOYMENT"
      name: "Deployment profile"
      description: "A versioned, reproducible description of a self-hosted or local installation, its enabled capabilities, dependencies, upgrade path, data locations, and measured reference workload."
      lifecycle: ["draft", "verified", "superseded", "retired"]
    - id: "ENT-CWS-REPOSITORY"
      name: "Content repository"
      description: "The Git repository that is the canonical durable representation and complete recoverable history of one workspace's materialised content, schema, policy, workflow, attachment manifests, and review state."
      lifecycle: ["initialised", "active", "read_only", "archived", "migrated"]
    - id: "ENT-CWS-SPACE"
      name: "Space"
      description: "A private, team, shared, or published portion of a workspace that owns a content hierarchy."
      lifecycle: ["active", "archived", "deleted"]
    - id: "ENT-CWS-PAGE"
      name: "Page"
      description: "A stable-identity document that has a title, typed blocks, metadata, links, comments, history, and optional structured properties."
      lifecycle: ["draft", "active", "archived", "trashed", "purged"]
    - id: "ENT-CWS-BLOCK"
      name: "Block"
      description: "A typed, ordered unit of page content such as text, heading, checklist, media, embed, database view, or reusable component."
      lifecycle: ["active", "replaced", "deleted"]
    - id: "ENT-CWS-DATABASE"
      name: "Database"
      description: "A collection of page records with a schema, properties, relationships, views, calculations, templates, and optional workflow settings."
      lifecycle: ["active", "locked", "archived", "trashed"]
    - id: "ENT-CWS-PROPERTY"
      name: "Property"
      description: "A named, typed field on database records, optionally validated, computed, relational, automated, or access-sensitive."
      lifecycle: ["draft", "active", "deprecated", "deleted"]
    - id: "ENT-CWS-VIEW"
      name: "View"
      description: "A saved presentation of a database or a linked source with layout, visible fields, filters, sorts, grouping, calculations, and audience."
      lifecycle: ["draft", "published", "archived", "deleted"]
    - id: "ENT-CWS-GRANT"
      name: "Grant"
      description: "A time-bounded or durable assignment of an access level, scope, restrictions, and delegability to a member, group, guest, or non-human identity."
      lifecycle: ["active", "expired", "revoked"]
    - id: "ENT-CWS-COMMENT"
      name: "Comment thread"
      description: "An attributed discussion anchored to a page, block, property, record, or view state."
      lifecycle: ["open", "resolved", "reopened", "deleted"]
    - id: "ENT-CWS-REVISION"
      name: "Revision"
      description: "An attributed, time-ordered recoverable representation of a change or restore operation."
      lifecycle: ["recorded", "retained", "expired", "held"]
    - id: "ENT-CWS-AUTOMATION"
      name: "Automation"
      description: "A versioned trigger, condition, action sequence, authority grant, and execution policy."
      lifecycle: ["draft", "active", "paused", "disabled", "archived"]
    - id: "ENT-CWS-RUN"
      name: "Automation run"
      description: "One attributable attempt to evaluate and execute an automation or assistant action."
      lifecycle: ["queued", "running", "awaiting_approval", "succeeded", "failed", "cancelled", "indeterminate"]
    - id: "ENT-CWS-INTEGRATION"
      name: "Integration"
      description: "A versioned external connection with a non-human identity, scopes, credentials, event subscriptions, and owner."
      lifecycle: ["draft", "active", "paused", "revoked", "removed"]
    - id: "ENT-CWS-EVENT"
      name: "Audit event"
      description: "An immutable record of an attempted or completed security, governance, content, automation, integration, or export action."
      lifecycle: ["recorded", "retained", "expired", "held"]
  glossary:
    - term: "effective scope"
      definition: "The intersection of a principal's active grants, organisation policy, resource classification, and the resource hierarchy at the time an action is evaluated."
    - term: "content change"
      definition: "A change to a page, block, record, property value, comment, attachment, or relationship, excluding a change to its schema, view definition, or access policy."
    - term: "structure change"
      definition: "A change to a content hierarchy, database schema, property, relation, formula, view definition, template, form, permission, automation, or integration configuration."
    - term: "linked view"
      definition: "A presentation embedded or saved in another context that reads and optionally writes the original database; it does not own a copied dataset."
    - term: "restore"
      definition: "The creation of a new current state from an earlier recoverable revision, without silently discarding the state being replaced."
    - term: "side effect"
      definition: "An action outside the workspace's own state, including sending a message, calling an external system, publishing content, or changing an external record."
    - term: "assistant output"
      definition: "Content, answer, classification, extraction, suggested action, or workflow proposal generated by an optional non-human assistant."
    - term: "free core"
      definition: "The complete implementation required to exercise every must capability, available under OSI-approved licences that permit use, study, modification, distribution, and commercial use without a licence fee or a vendor's discretionary approval."
    - term: "vendor lock-in"
      definition: "A condition in which a participant cannot continue to exercise a contract capability, recover its data, or operate a deployment without a named provider's account, subscription, proprietary component, or network."
    - term: "local-first"
      definition: "A mode in which a participant can read and create locally available authorised content while disconnected, with later synchronisation that merges or explicitly surfaces conflicts without silent loss."
    - term: "reference workload"
      definition: "A published, versioned dataset and action sequence that states its client count, concurrent editors, pages, blocks, records, attachments, searches, automations, network conditions, and reference hardware."
    - term: "Git-backed"
      definition: "A mode in which the content repository is the sole canonical durable state and history; projections, indexes, caches, relays, and client working copies are derived and rebuildable."
    - term: "semantic commit"
      definition: "An attributed Git revision representing a meaningful accepted state transition such as save, publish, merge, restore, schema migration, automation result, or explicit synchronisation checkpoint, rather than an individual keystroke."
    - term: "materialisation"
      definition: "The deterministic conversion of accepted local or collaborative operations into the canonical repository representation and a semantic commit."
    - term: "authentication factor"
      definition: "Evidence controlled by or cryptographically bound to an account that is verified to establish identity; a factor may be knowledge, possession, inherence, or a user-verifying public-key credential."
    - term: "session"
      definition: "A revocable, time-bounded authenticated interaction created after verified authentication or reauthentication; it is not a content grant and is evaluated with current policy for every protected operation."
    - term: "step-up authentication"
      definition: "Fresh verification at a required assurance level before a sensitive action, rather than relying solely on an earlier session assertion."
    - term: "recovery method"
      definition: "A separately protected, pre-registered mechanism for regaining access or replacing an authenticator; it has an assurance level and cannot silently weaken the account's required factors."
    - term: "security event"
      definition: "An attributable accepted or denied authentication, session, recovery, credential, device, privilege, secret, or anomaly-handling action with protected values omitted."

capabilities:
  - id: "CAP-CWS-001"
    name: "Organise governed workspaces"
    priority: "must"
    actor: "ACT-CWS-OWNER"
    outcome: "A team has distinct private, shared, and team scopes with clear ownership and membership."
    requirements:
      - id: "REQ-CWS-001"
        statement: "Each workspace has a stable identifier, at least one accountable owner while active, a membership list, and an explicit policy set."
      - id: "REQ-CWS-002"
        statement: "A workspace can contain private areas, team spaces, shared spaces, and published spaces; moving content between them preserves its identity and reevaluates its effective scope before exposure."
      - id: "REQ-CWS-003"
        statement: "Ownership transfer requires an eligible recipient, an explicit confirmation, and an attributed audit event; an active workspace never becomes ownerless."
  - id: "CAP-CWS-002"
    name: "Author rich connected documents"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "A participant builds navigable knowledge from ordered blocks and connected pages."
    requirements:
      - id: "REQ-CWS-004"
        statement: "A page has a stable identity independent of title, parent, path, icon, cover, publication state, or current contents."
      - id: "REQ-CWS-005"
        statement: "An authorised editor can create, nest, reorder, duplicate, transform, and delete typed blocks, including text, media, attachments, embeds, links, mentions, checklists, code, tables, databases, and reusable content."
      - id: "REQ-CWS-006"
        statement: "A reference to a page, block, database record, person, date, or external URL is resolvable only when the recipient has current access to the target; inaccessible targets reveal neither title nor content."
      - id: "REQ-CWS-007"
        statement: "The system records backlinks and explicit links so an authorised reader can navigate outgoing and incoming relationships without granting access to inaccessible neighbours."
  - id: "CAP-CWS-003"
    name: "Collaborate on live content"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "Several authorised participants can edit and discuss the same work without silent data loss."
    requirements:
      - id: "REQ-CWS-008"
        statement: "The interface identifies active authorised participants and their current editing location or selection when they choose to be visible."
      - id: "REQ-CWS-009"
        statement: "Concurrent compatible edits converge into one current state; incompatible edits are preserved for review or presented as a conflict before an editor can discard either change."
      - id: "REQ-CWS-010"
        statement: "A disconnected editor can retain an unsent local draft, and reconnecting never overwrites a newer remote state silently."
      - id: "REQ-CWS-011"
        statement: "A user can create a comment thread on a page, block, database record, property, or selected content; replies, reactions, resolution, reopening, and deletion retain attribution."
  - id: "CAP-CWS-004"
    name: "Model operational data"
    priority: "must"
    actor: "ACT-CWS-STEWARD"
    outcome: "A steward turns repeated work into validated, connected records that remain rich documents."
    requirements:
      - id: "REQ-CWS-012"
        statement: "A database record is a page with a stable identifier, rich body, typed property values, creator and edit metadata, comments, revisions, and ordinary page permissions."
      - id: "REQ-CWS-013"
        statement: "A steward can define property types for text, number, currency, status, select, multi-select, person, date and time, checkbox, URL, email, phone, file, identifier, relation, rollup, formula, and button; a property declares whether it is editable, required, unique, computed, or sensitive."
      - id: "REQ-CWS-014"
        statement: "Property validation rejects an invalid record change atomically and returns every failing field without keeping a partial update."
      - id: "REQ-CWS-015"
        statement: "Relations may be one-way or two-way with optional cardinality limits; a rollup or formula is recalculated from the authorised current values and identifies unavailable, invalid, or cyclic dependencies."
      - id: "REQ-CWS-016"
        statement: "A database can define sub-items, dependencies, assignees, statuses, dates, priorities, recurring templates, and progress calculations without treating one work-management vocabulary as mandatory."
  - id: "CAP-CWS-005"
    name: "Present data in contextual views"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "Participants see the same authorised source data as useful boards, tables, calendars, timelines, charts, maps, forms, and dashboards."
    requirements:
      - id: "REQ-CWS-017"
        statement: "A view has a stable identity and a declared source, layout, visible fields, filters, sorts, grouping, calculations, layout settings, and audience; changing a view never changes record values unless the actor edits a record explicitly."
      - id: "REQ-CWS-018"
        statement: "A linked view writes to and reads from its original source while keeping its local presentation settings independent; it cannot widen visibility beyond the source records the viewer may access."
      - id: "REQ-CWS-019"
        statement: "An authorised user can save personal views that are private by default and can publish a shared view only when granted structure authority."
      - id: "REQ-CWS-020"
        statement: "Forms, charts, maps, dashboards, and record-detail interfaces declare which fields, records, actions, comments, and history are exposed, and enforce the same effective scope as the source."
  - id: "CAP-CWS-006"
    name: "Find and navigate authorised knowledge"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "A participant quickly returns to relevant work and finds information they are allowed to know."
    requirements:
      - id: "REQ-CWS-021"
        statement: "Search indexes page titles, authorised text, properties, labels, and supported attachment text according to workspace policy, and filters results before snippets, counts, facets, or suggestions are returned."
      - id: "REQ-CWS-022"
        statement: "Users can organise authorised content with hierarchy, collections, labels, favourites, recents, and saved searches; these organisation aids do not copy or reclassify source content implicitly."
      - id: "REQ-CWS-023"
        statement: "Recommendations, graph navigation, and AI answers are optional features and expose only sources the requesting actor could open directly."
  - id: "CAP-CWS-007"
    name: "Share with precise access control"
    priority: "must"
    actor: "ACT-CWS-STEWARD"
    outcome: "Owners and stewards share the right audience and operation without relying on hidden interface controls."
    requirements:
      - id: "REQ-CWS-024"
        statement: "A grant identifies its principal, scope, access level, restrictions, issuer, time bounds, and delegation rule; access levels distinguish at least view, comment, edit content, edit structure, share, export, and administer."
      - id: "REQ-CWS-025"
        statement: "Every read, search, write, comment, relation traversal, notification, attachment retrieval, history view, export, automation action, API request, and public publication is authorised against current effective scope at the point of action."
      - id: "REQ-CWS-026"
        statement: "A content editor may create and change authorised records and properties without being able to change the database schema, shared views, forms, automation, or grants unless separately authorised."
      - id: "REQ-CWS-027"
        statement: "A share link is explicit about its audience, access level, expiry, indexability policy, and revocation state; expiry or revocation prevents subsequent access immediately."
      - id: "REQ-CWS-028"
        statement: "An unauthorised user may request access without learning hidden content; the decision, approver, resulting grant, and notification are attributed."
  - id: "CAP-CWS-008"
    name: "Keep a recoverable history"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "An authorised participant can understand, undo, restore, and recover collaboration without rewriting accountability."
    requirements:
      - id: "REQ-CWS-029"
        statement: "Every accepted content, structure, permission, automation, integration, import, export, publish, archive, restore, and deletion action records actor or non-human identity, time, target, requested operation, outcome, and correlation identifier."
      - id: "REQ-CWS-030"
        statement: "An authorised reader can inspect a recoverable revision's authorship, time, affected scope, and meaningful difference from the current state, subject to retention and sensitivity policy."
      - id: "REQ-CWS-031"
        statement: "Restoring a recoverable revision creates a new current revision attributed to the restorer and retains the state it replaced as recoverable history."
      - id: "REQ-CWS-032"
        statement: "Deleting a page, record, database, view, attachment, template, or automation first moves it to a recoverable trash state with a policy-defined expiry; permanent purge requires elevated authority, confirmation, and an audit event."
  - id: "CAP-CWS-009"
    name: "Use templates, forms, imports, and exports"
    priority: "should"
    actor: "ACT-CWS-MEMBER"
    outcome: "Teams accelerate repeatable work and retain portability without corrupting existing information."
    requirements:
      - id: "REQ-CWS-033"
        statement: "A template can predefine page blocks, record properties, view layouts, tasks, relations, and permitted automation inputs without sharing template-private content with a recipient."
      - id: "REQ-CWS-034"
        statement: "A form creates or proposes a record only in its declared destination and exposes only its declared fields; submitters receive no visibility of other records unless separately granted."
      - id: "REQ-CWS-035"
        statement: "An import validates mappings, types, references, duplicates, permissions, and proposed side effects before committing; it produces a reviewable result for accepted, skipped, and failed items."
      - id: "REQ-CWS-036"
        statement: "An export contains only resources and fields the requesting principal may export, reports omitted or redacted content, and supports portable document, structured-data, and attachment representations."
  - id: "CAP-CWS-010"
    name: "Communicate changes and assignments"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "People know when they are mentioned, assigned, invited, asked for access, or affected by governed changes."
    requirements:
      - id: "REQ-CWS-037"
        statement: "A mention, assignment, reply, reminder, access request, share, approval request, automation failure, and subscription event can create a notification for an eligible recipient."
      - id: "REQ-CWS-038"
        statement: "Notifications identify the source, actor, action, time, and current accessibility without leaking a title, excerpt, identity, or metadata from inaccessible content."
      - id: "REQ-CWS-039"
        statement: "Each user can configure permitted delivery channels, quiet periods, subscriptions, and read or archived state, subject to mandatory security and governance notices."
  - id: "CAP-CWS-011"
    name: "Automate governed workflows"
    priority: "should"
    actor: "ACT-CWS-STEWARD"
    outcome: "A team removes repetitive work while retaining authority, explainability, approval, and a safe failure mode."
    requirements:
      - id: "REQ-CWS-040"
        statement: "An automation is a versioned definition of eligible triggers, conditions, inputs, actions, error policy, owner, scope, execution identity, approval policy, concurrency limit, and retry policy."
      - id: "REQ-CWS-041"
        statement: "Triggers may be content events, property changes, relation changes, form submissions, buttons, approvals, schedules, or authorised integration events; loop prevention and recursion limits are explicit."
      - id: "REQ-CWS-042"
        statement: "An automation may create or update authorised workspace content, notify eligible people, request approval, or invoke a granted integration; it cannot increase its own scope or the scope of its execution identity."
      - id: "REQ-CWS-043"
        statement: "Each run records its definition version, trigger, inputs with protected values masked, actions, target identities, outputs, attempts, side effects, status, and failure reason; a failure pauses the run and applies the declared retry or escalation policy."
      - id: "REQ-CWS-044"
        statement: "A non-idempotent or external side effect is never repeated automatically after an indeterminate outcome and requires an authorised human decision to retry or compensate."
  - id: "CAP-CWS-012"
    name: "Connect external systems safely"
    priority: "should"
    actor: "ACT-CWS-INTEGRATION"
    outcome: "Connected tools add value without becoming a path around workspace control."
    requirements:
      - id: "REQ-CWS-045"
        statement: "An integration has a distinct identity, accountable owner, declared purpose, capability set, scope, credential lifecycle, event subscription list, and revocation state."
      - id: "REQ-CWS-046"
        statement: "An integration receives, searches, reads, writes, exports, or subscribes only to content explicitly granted to its identity; removing a grant revokes both direct and event-based access."
      - id: "REQ-CWS-047"
        statement: "Outbound webhooks and inbound commands validate origin, payload, replay protection, scope, and rate policy; failed deliveries are observable without leaking protected payload values."
      - id: "REQ-CWS-048"
        statement: "Import, synchronisation, and API writes identify the integration and source record, preserve source provenance, and follow the same validation, conflict, history, and permission rules as human writes."
  - id: "CAP-CWS-013"
    name: "Assist with AI under human control"
    priority: "could"
    actor: "ACT-CWS-AUTOMATION"
    outcome: "An optional assistant helps people create and understand work without silently broadening data access or acting externally."
    requirements:
      - id: "REQ-CWS-049"
        statement: "An assistant request declares its requester, purpose, allowed source scope, selected content, output destination, model or service policy, and whether the output is a suggestion or an approved action."
      - id: "REQ-CWS-050"
        statement: "An assistant can read only content within the requester's effective scope and the assistant's grant, returns citations or source identifiers for workspace-grounded claims when sources exist, and states when it lacks sufficient authorised evidence."
      - id: "REQ-CWS-051"
        statement: "An assistant output is attributable to the assistant and requesting actor, distinguishable from human-authored content, editable before acceptance, and subject to normal revision, classification, and retention policy."
      - id: "REQ-CWS-052"
        statement: "An assistant cannot publish, share, change permissions, delete permanently, trigger an external side effect, or make a structural change without a separately authorised automation action and any required human approval."
  - id: "CAP-CWS-014"
    name: "Govern security and lifecycle"
    priority: "must"
    actor: "ACT-CWS-OWNER"
    outcome: "An organisation can secure, audit, retain, transfer, recover, and retire workspace data deliberately."
    requirements:
      - id: "REQ-CWS-053"
        statement: "Workspace and organisation policy can govern authentication requirements, membership, public sharing, external guests, classification, export, integration, automation, AI, retention, legal hold, and deletion authority."
      - id: "REQ-CWS-054"
        statement: "An audit log supports filtering and authorised export of security and governance events; its event metadata does not expose protected content values unless policy explicitly grants them."
      - id: "REQ-CWS-055"
        statement: "A retention rule and legal hold are evaluated before trash expiry, purge, workspace deletion, or automatic cleanup; a hold wins until an authorised release is recorded."
      - id: "REQ-CWS-056"
        statement: "Workspace backup, restore, migration, and ownership-transfer procedures declare their scope, point in time, identity mapping, conflicts, excluded secrets, and verification result before they change production content."
  - id: "CAP-CWS-015"
    name: "Work across devices accessibly"
    priority: "should"
    actor: "ACT-CWS-MEMBER"
    outcome: "People can use the workspace with keyboard, assistive technology, multiple locales, and supported connected devices."
    requirements:
      - id: "REQ-CWS-057"
        statement: "Core authoring, navigation, search, sharing, commenting, database editing, history inspection, and approval flows are operable with keyboard and expose semantic names, roles, states, errors, and focus changes to assistive technology."
      - id: "REQ-CWS-058"
        statement: "Dates, times, calendars, reminders, schedules, number formats, text direction, and translated interface labels respect a user's locale and time-zone preferences while storing an unambiguous instant where one exists."
      - id: "REQ-CWS-059"
        statement: "A supported client that cannot render a feature presents its content, access state, and safe fallback rather than silently dropping data or executing an unavailable action."
  - id: "CAP-CWS-016"
    name: "Own and operate a free Git-backed local-first core"
    priority: "must"
    actor: "ACT-CWS-OWNER"
    outcome: "An owner can build, run, upgrade, back up, and use every must capability on infrastructure they control, with Git as durable truth even when disconnected from a vendor."
    requirements:
      - id: "REQ-CWS-060"
        statement: "The complete free core, including every component needed to exercise a must capability in production, is published as human-readable source under OSI-approved licences that permit commercial and non-commercial use, modification, redistribution, and self-hosting without a licence key, vendor approval, or recurring fee."
      - id: "REQ-CWS-061"
        statement: "A documented reproducible deployment profile installs and verifies every must capability without a vendor account, proprietary runtime, vendor-operated identity, mandatory telemetry, or mandatory outbound connection; optional external services remain replaceable and disabled by default."
      - id: "REQ-CWS-062"
        statement: "A participant can read and create locally available authorised content while disconnected; each local accepted change has a durable identity in a local operation journal and later synchronisation either converges it with the shared state or surfaces an explicit conflict without silent loss before materialisation to Git."
      - id: "REQ-CWS-063"
        statement: "Synchronisation supports a documented self-hosted or direct peer topology and encrypts content in transit; a workspace may enable end-to-end encryption for a declared scope only when its search, recovery, automation, and key-sharing limitations remain explicit."
      - id: "REQ-CWS-064"
        statement: "An upgrade, downgrade, backup, restore, or migration can be rehearsed from a Git repository copy using documented representations and compatibility rules, produces a machine-readable result, and never requires a vendor-operated service to recover workspace data."
  - id: "CAP-CWS-017"
    name: "Remain responsive at scale"
    priority: "must"
    actor: "ACT-CWS-OWNER"
    outcome: "An operator can select a conforming deployment whose responsiveness, synchronisation, search, and resource use are measured rather than assumed."
    requirements:
      - id: "REQ-CWS-065"
        statement: "Each release publishes a reference workload and deployment profile covering at least ten concurrent editors, one hundred thousand records, ten thousand pages, one million blocks, attachments, search queries, offline changes, and synchronisation recovery, together with hardware, network, dataset, configuration, and measurement method."
      - id: "REQ-CWS-066"
        statement: "On the published reference profile, the p95 latency for an accepted local edit is at most 100 ms, an authorised full-text search is at most 500 ms, and propagation of a connected collaborative edit is at most one second, excluding user-selected external integrations and optional assistant inference."
      - id: "REQ-CWS-067"
        statement: "The reference workload reports p50, p95, p99, throughput, memory, storage growth, network transfer, index-build time, recovery time, and every failed or degraded action; an implementation cannot claim conformance while omitting a measured limit."
      - id: "REQ-CWS-068"
        statement: "A resource limit, unavailable index, degraded network, or exhausted storage preserves locally durable edits and gives the affected user an actionable state; it never discards accepted content, silently disables a security check, or falls back to a vendor service."
  - id: "CAP-CWS-018"
    name: "Materialise collaborative work into Git"
    priority: "must"
    actor: "ACT-CWS-STEWARD"
    outcome: "A team receives a portable Git history of meaningful workspace state while live co-editing remains responsive."
    requirements:
      - id: "REQ-CWS-069"
        statement: "One content repository is the sole canonical durable representation of a workspace's documents, structured records, schemas, views, templates, workflow definitions, policy declarations, review states, and attachment manifests; credentials, private keys, active sessions, and unencrypted secret values never enter it."
      - id: "REQ-CWS-070"
        statement: "Every accepted semantic state transition materialises deterministically to the content repository as an attributed Git revision that names the responsible human or non-human identity, operation, source operation range, time, and parent revision or merge ancestry."
      - id: "REQ-CWS-071"
        statement: "Live block operations may remain in a local or shared operation journal between checkpoints, but a semantic commit is created for explicit save, publish, merge, restore, schema migration, approved automation result, and an operator-configured checkpoint; an implementation never creates a Git revision merely for an individual keystroke."
      - id: "REQ-CWS-072"
        statement: "Any search index, relational projection, cache, collaboration relay, or database view can be rebuilt from the repository and declared attachments; if it diverges or is unavailable, it is repaired or disabled without replacing, overwriting, or silently changing the latest canonical Git revision."
      - id: "REQ-CWS-073"
        statement: "An attachment is stored directly in the repository or referenced by an immutable content hash in a repository manifest; retrieval verifies that hash and a missing attachment remains an explicit unavailable state rather than a substituted file."
      - id: "REQ-CWS-074"
        statement: "A revision written directly to the repository is validated for representation, schema, references, permissions, policy declarations, and attachment integrity before it is exposed through collaboration, search, automation, or derived views; invalid revisions remain inspectable but are not materialised as current workspace state."
  - id: "CAP-CWS-019"
    name: "Authenticate people and contain sessions"
    priority: "must"
    actor: "ACT-CWS-MEMBER"
    outcome: "A participant can authenticate, manage trusted devices and sessions, recover access safely, and immediately contain a compromised identity without exposing workspace data or secrets."
    requirements:
      - id: "REQ-CWS-075"
        statement: "An account has a stable identifier, explicit verification and lifecycle state, and a separately managed set of authenticators, recovery methods, devices, memberships, and assurance policy; a deployment has no undocumented shared, default, or permanently privileged human account."
      - id: "REQ-CWS-076"
        statement: "A self-hosted deployment provides at least one non-vendor-controlled authentication path and a user-verifying public-key authentication factor for owners and administrators; policy can require multiple independent factors, stronger factors for elevated authority, and compatible federation without making an external identity provider mandatory."
      - id: "REQ-CWS-077"
        statement: "Authentication, registration, recovery, and factor-enrolment flows resist credential stuffing, brute force, replay, enumeration, and automated abuse through documented rate, attempt, challenge, notification, and anomaly controls; an unauthenticated response does not disclose whether an account, factor, or recovery method exists."
      - id: "REQ-CWS-078"
        statement: "Password verifiers, recovery codes, active-session identifiers, private authentication material, and integration secrets are non-reversibly verified or encrypted as appropriate, are never emitted in logs, audit events, diagnostics, exports, or the content repository, and can be rotated or revoked without changing content history."
      - id: "REQ-CWS-079"
        statement: "A session is created only after successful authentication or approved federation, uses a newly generated opaque credential, records its account, device or client context, assurance, scopes, issue time, inactivity expiry, and absolute expiry, and is renewed or refreshed only under current policy."
      - id: "REQ-CWS-080"
        statement: "Authentication, reauthentication, privilege change, factor registration or replacement, recovery completion, and suspicious-session handling rotate or invalidate affected session credentials; a credential is never accepted after its account, session, authenticator, recovery method, or policy prerequisite has been revoked, suspended, expired, or weakened."
      - id: "REQ-CWS-081"
        statement: "A participant and an authorised administrator can inspect and terminate active sessions by device or client context, terminate all sessions, revoke a lost authenticator, and suspend an account; account suspension or deprovisioning contains every protected session before its next protected operation."
      - id: "REQ-CWS-082"
        statement: "Step-up authentication at the policy-required assurance is required before changing an authenticator, recovery method, password, owner or administrator role, federation link, export authority, integration secret, end-to-end-encryption key, or other action that could materially widen access or prevent recovery."
      - id: "REQ-CWS-083"
        statement: "Account recovery uses only pre-registered or explicitly governed evidence, is time-bounded, rate-limited, attributable, and notified through independent available channels; it does not silently remove a required factor or grant elevated authority, and high-risk recovery can require a cooling-off period or authorised review."
      - id: "REQ-CWS-084"
        statement: "The system records security events for authentication, denial, factor and recovery changes, session creation, renewal, termination, suspicious activity, privilege changes, secret rotation, and policy decisions; authorised operators can investigate them without reading protected secret or workspace-content values."

invariants:
  - id: "INV-CWS-001"
    statement: "No action exposes or changes a resource, derivative, history entry, search result, notification, export, integration event, or assistant context outside the actor's effective scope."
    rationale: "Every surface is a potential path to a sensitive source."
  - id: "INV-CWS-002"
    statement: "A stable resource identity is never silently reassigned to unrelated content, and links, relations, comments, revisions, grants, and audit events retain the identity they were created against."
    rationale: "Traceability and collaboration depend on durable references."
  - id: "INV-CWS-003"
    statement: "A rejected or conflicted change never partially mutates the current state; accepted concurrent work is either converged or explicitly preserved for resolution."
    rationale: "Collaboration must not lose work invisibly."
  - id: "INV-CWS-004"
    statement: "A restore, archive, revoke, delete, purge, import, automated change, assistant action, and permission change is attributed and recorded as a new event rather than rewriting prior accountability."
    rationale: "Recovery cannot erase the explanation of how current state arose."
  - id: "INV-CWS-005"
    statement: "A linked view, dashboard, form, chart, map, export, cache, index, notification, or search result cannot grant access that the underlying source would deny."
    rationale: "Derived presentations must not bypass source authorisation."
  - id: "INV-CWS-006"
    statement: "A computed property, formula, filter, sort, layout, recommendation, or assistant answer cannot cause a write or external side effect merely by being evaluated."
    rationale: "Reading and rendering must be safe."
  - id: "INV-CWS-007"
    statement: "No automation, integration, assistant, or user can create, widen, delegate, or renew its own authority without a separately authorised grant change."
    rationale: "Automation convenience must not become privilege escalation."
  - id: "INV-CWS-008"
    statement: "Revocation, expiry, suspension, and policy tightening take effect before the next protected operation and invalidate outstanding share, event-delivery, and automation authorisation."
    rationale: "Removed access must be meaningful immediately."
  - id: "INV-CWS-009"
    statement: "Protected values, secrets, credentials, and inaccessible content are masked or omitted from activity, errors, notifications, assistant context, automation logs, and integration diagnostics."
    rationale: "Observability must not leak the data it protects."
  - id: "INV-CWS-010"
    statement: "Retention policy and an active legal hold override automatic deletion, purge, and history expiry until an authorised release is recorded."
    rationale: "Lifecycle automation must obey governance obligations."
  - id: "INV-CWS-011"
    statement: "No must capability depends on a vendor account, subscription, licence key, proprietary component, forced telemetry, or vendor-operated network; an optional service never becomes the exclusive path to contract conformance."
    rationale: "The product must remain genuinely free and operable by its users."
  - id: "INV-CWS-012"
    statement: "A locally accepted offline change is durable until it has converged with, been explicitly rejected by, or been explicitly resolved against a later shared state."
    rationale: "Local-first operation cannot lose work during disconnection or recovery."
  - id: "INV-CWS-013"
    statement: "A self-hosted deployment does not send workspace content, identifiers, usage events, credentials, or telemetry to an external party unless an owner has enabled that named destination and scope explicitly."
    rationale: "Self-hosting and data control require a closed default egress boundary."
  - id: "INV-CWS-014"
    statement: "Every current or recoverable canonical workspace state is reachable from an immutable Git revision in the content repository; a derived store can never be the only surviving copy of that state."
    rationale: "Git-backed status is meaningful only when the repository is the recoverable authority."
  - id: "INV-CWS-015"
    statement: "A restore, merge, conflict resolution, direct-repository import, or repair creates a new canonical Git revision and never silently rewrites reachable history."
    rationale: "Git history must remain an honest audit trail; legal erasure remains outside this core." 
  - id: "INV-CWS-016"
    statement: "No protected operation succeeds without a currently valid account, session, effective scope, and policy decision; a content grant, Git revision, device identifier, recovered account, or stale session can never substitute for fresh authentication where policy requires it."
    rationale: "Repository authority and content permissions do not authenticate a caller."
  - id: "INV-CWS-017"
    statement: "A session, authenticator, recovery method, or service credential cannot outlive its configured validity or remain usable after relevant revocation, suspension, deprovisioning, policy tightening, or account recovery; every protected operation observes the current security state."
    rationale: "Compromise containment must not wait for an arbitrary cache or token lifetime."

policies:
  - id: "POL-CWS-001"
    decision: "Content authority, structure authority, sharing authority, export authority, and administration authority are separate grants."
    consequence: "A contributor can safely update records without silently changing the shared information model or audience."
  - id: "POL-CWS-002"
    decision: "Deny by default when scope, classification, identity, or policy evaluation is incomplete or unavailable."
    consequence: "An outage or ambiguity hides protected information instead of broadening access."
  - id: "POL-CWS-003"
    decision: "Public publication, external guests, exports, webhooks, integrations, and AI are opt-in workspace capabilities that owners or organisation policy can disable."
    consequence: "Sensitive workspaces can operate without unreviewed egress paths."
  - id: "POL-CWS-004"
    decision: "Shared views are stewarded artifacts and personal views are private by default."
    consequence: "People can adapt their own work without destabilising a team's common workflow."
  - id: "POL-CWS-005"
    decision: "Potentially irreversible, destructive, high-volume, or external automation actions require explicit policy classification and may require a human approval."
    consequence: "A workflow can be efficient without concealing consequential effects."
  - id: "POL-CWS-006"
    decision: "Assistant output is a proposal by default and must expose its identity and available source provenance."
    consequence: "People can judge and revise generated work before relying on it."
  - id: "POL-CWS-007"
    decision: "History, audit, backup, and retention have independently configurable purposes and access rules."
    consequence: "A short collaboration history does not silently eliminate required security evidence or recoverability."
  - id: "POL-CWS-008"
    decision: "Schema changes are previewed and validated against affected records before they become current, with an explicit migration or rejection result."
    consequence: "A field, relation, formula, or status change cannot silently corrupt existing operational data."
  - id: "POL-CWS-009"
    decision: "The free core is the product baseline: all must capabilities, their security controls, self-hosting path, data export, backup, restore, and performance evidence are available without a paid edition."
    consequence: "A hosted offer, support contract, marketplace item, or external connector may be optional, but cannot be used to withhold conformance."
  - id: "POL-CWS-010"
    decision: "Local-first operation and self-hosting are first-class modes; cloud synchronisation, remote inference, and external observability are explicit opt-ins."
    consequence: "An outage, commercial change, or shutdown of an external service cannot prevent a team from reading, editing, exporting, or recovering its own data."
  - id: "POL-CWS-011"
    decision: "Git is the canonical durable state and history; journals, indexes, caches, projections, relays, and forges are replaceable derived services."
    consequence: "A local repository, self-hosted forge, or hosted forge may be used without changing product truth, and all derived services can be rebuilt or replaced."
  - id: "POL-CWS-012"
    decision: "Git commits represent semantic accepted states rather than keystrokes; live collaboration uses a journal and materialisation checkpoints."
    consequence: "The product keeps real-time editing responsive while retaining reviewable, compact, attributable Git history."
  - id: "POL-CWS-013"
    decision: "Authentication is defence in depth: public-key, user-verifying factors are preferred for elevated access; multi-factor authentication, step-up, session lifetime, concurrent-session limits, device trust, recovery, and federation assurance are explicit owner or organisation policies."
    consequence: "A self-hosted deployment can choose its identity architecture without silently lowering protection for ownership or administration."
  - id: "POL-CWS-014"
    decision: "Sessions, authenticators, recovery evidence, and service secrets are security state outside the canonical content repository; their minimal lifecycle evidence is audited with protected values redacted, and revocation fails closed."
    consequence: "Git portability cannot turn a repository clone, audit export, or diagnostic into reusable access credentials."

quality_attributes:
  - id: "QA-CWS-001"
    attribute: "authorisation completeness"
    target: "The conformance suite reports 0 successful reads, writes, search disclosures, exports, notifications, relation traversals, integration deliveries, or assistant citations outside effective scope."
  - id: "QA-CWS-002"
    attribute: "collaboration integrity"
    target: "In the concurrent-edit reference workload, 100% of accepted changes appear in the converged state or an explicit conflict record, and 0 accepted changes disappear silently."
  - id: "QA-CWS-003"
    attribute: "traceability"
    target: "100% of accepted and denied governed actions in the reference workload have an event naming actor or identity, action, target, policy decision, time, correlation identifier, and result."
  - id: "QA-CWS-004"
    attribute: "recoverability"
    target: "100% of tested restores create a new attributed revision and retain both the restored source revision and the prior current revision until policy expiry."
  - id: "QA-CWS-005"
    attribute: "revocation latency"
    target: "After a revocation event is accepted, 0 protected operations started after that event succeed under the revoked authority in the reference workload."
  - id: "QA-CWS-006"
    attribute: "automation safety"
    target: "100% of failed, paused, cancelled, and indeterminate automation runs have inspectable inputs with protected values masked, actions, identity, version, result, and retry or approval state."
  - id: "QA-CWS-007"
    attribute: "portability"
    target: "A documented export-import reference set preserves page hierarchy, text, attachments, record identifiers, editable property values, relations, comments, and explicit omissions with 0 unreported losses."
  - id: "QA-CWS-008"
    attribute: "accessibility"
    target: "The documented accessibility suite verifies keyboard and assistive-technology operation for every must capability and reports no critical blocked flow."
  - id: "QA-CWS-009"
    attribute: "software freedom"
    target: "A clean-room conformance run builds and operates every must capability from the published source and deployment profile with 0 vendor accounts, subscriptions, licence keys, proprietary runtime components, or mandatory external network destinations."
  - id: "QA-CWS-010"
    attribute: "local-first resilience"
    target: "In the reference offline-reconnect workload, 100% of locally accepted edits converge or appear as explicit conflicts, and 0 accepted edits disappear silently."
  - id: "QA-CWS-011"
    attribute: "responsiveness"
    target: "The published reference profile meets the p95 limits in REQ-CWS-066 and reports p50, p95, p99, resource consumption, recovery, and degraded-operation outcomes."
  - id: "QA-CWS-012"
    attribute: "self-hosted privacy"
    target: "The self-hosted network-observation suite reports 0 unsolicited external transmissions of workspace data, identifiers, usage data, credentials, or telemetry."
  - id: "QA-CWS-013"
    attribute: "Git provenance"
    target: "The Git materialisation conformance suite reports that 100% of semantic transitions and recoverable current states are reachable, attributable, validated, and reproducible from the content repository."
  - id: "QA-CWS-014"
    attribute: "derived-store recovery"
    target: "After deleting each supported index, cache, projection, or relay independently in the reference workload, the implementation rebuilds it from Git and attachment manifests with 0 unreported canonical-content losses."
  - id: "QA-CWS-015"
    attribute: "authentication and recovery containment"
    target: "The security conformance suite reports 0 successful protected operations after a tested session, account, authenticator, recovery method, service credential, or required policy assurance has been revoked, suspended, expired, or invalidated."
  - id: "QA-CWS-016"
    attribute: "security-event accountability"
    target: "100% of accepted and denied authentication, session, recovery, factor, privilege, and secret-lifecycle scenarios in the security conformance suite create attributable security events with protected values absent."

integrations:
  - id: "INT-CWS-001"
    system: "Identity and directory provider"
    purpose: "Authenticate people and synchronise permitted membership or groups."
    degradation: "New protected sessions and membership changes stop when identity cannot be verified; existing access is rechecked under workspace policy and never widened."
  - id: "INT-CWS-002"
    system: "Notification delivery service"
    purpose: "Deliver configured in-product, email, push, or external collaboration notifications."
    degradation: "The event remains visible in the workspace inbox and delivery failure is observable; the content action itself is not repeated."
  - id: "INT-CWS-003"
    system: "File and media service"
    purpose: "Store, transform, preview, and retrieve authorised attachments."
    degradation: "A file is marked unavailable or pending and cannot be exposed through a guessed reference; text and metadata remain available when safe."
  - id: "INT-CWS-004"
    system: "Calendar, mail, chat, or task service"
    purpose: "Synchronise approved scheduling, messages, tasks, or notifications."
    degradation: "The affected automation or synchronisation pauses with an attributed error and does not create duplicate external effects automatically."
  - id: "INT-CWS-005"
    system: "External API client or webhook receiver"
    purpose: "Exchange authorised content or events with connected applications."
    degradation: "Failed or unverified requests are rejected or paused, recorded with protected fields masked, and retried only under declared idempotency policy."
  - id: "INT-CWS-006"
    system: "Import and export format handler"
    purpose: "Move authorised documents, records, files, and relationships into or out of a workspace."
    degradation: "No partial import becomes current without a reviewable result; failed exports reveal neither unavailable data nor protected values."
  - id: "INT-CWS-007"
    system: "Search and indexing service"
    purpose: "Index authorised content and answer scoped search requests."
    degradation: "Search may be delayed or incomplete but returns no unauthorised title, count, facet, snippet, or suggestion."
  - id: "INT-CWS-008"
    system: "AI or model service"
    purpose: "Produce opted-in assistant output from an authorised request."
    degradation: "The request fails visibly or remains local under policy; no unsupported output is represented as verified workspace knowledge."
  - id: "INT-CWS-009"
    system: "Audit archive or security monitoring service"
    purpose: "Export or stream authorised governance events."
    degradation: "The workspace retains its configured local audit evidence and alerts an authorised owner if external delivery is required but unavailable."
  - id: "INT-CWS-010"
    system: "Map, chart, embed, or visualisation service"
    purpose: "Render opted-in data in specialised presentations."
    degradation: "The presentation shows a safe unavailable state and never transfers data outside its declared integration scope."

acceptance:
  - id: "ACC-CWS-001"
    given: "A member can edit content but cannot edit structure in a shared task database."
    when: "They create a record, update permitted property values, then attempt to change a property type, shared filter, form, automation, and grant through every available surface."
    then: "Only the content changes succeed; every structure attempt is denied without a partial mutation and an attributed event is recorded."
    evidence: "Permission-separation conformance test for REQ-CWS-024 through REQ-CWS-026 and INV-CWS-001."
  - id: "ACC-CWS-002"
    given: "Two editors have concurrent authority on the same page and one loses connectivity after making changes."
    when: "Both modify overlapping and non-overlapping blocks, then the disconnected editor reconnects."
    then: "Compatible changes converge, an incompatible change is visible for resolution, and no accepted change is silently lost or overwrites a newer remote state."
    evidence: "Concurrent and offline editing test meeting REQ-CWS-009, REQ-CWS-010, and QA-CWS-002."
  - id: "ACC-CWS-003"
    given: "A database has required, unique, relation, formula, and sensitive properties."
    when: "An editor submits a record that violates several validations and references an inaccessible record."
    then: "The record is unchanged, all validly observable errors are returned, and neither the inaccessible title nor a partial update appears."
    evidence: "Atomic database-validation and disclosure test for REQ-CWS-013 through REQ-CWS-015."
  - id: "ACC-CWS-004"
    given: "A viewer may access a filtered linked view but not several records and fields in its source database."
    when: "They search, filter, export, open a relation, inspect a chart, submit a form, and receive a notification involving those hidden records."
    then: "Every derivative surface omits inaccessible data and does not expose titles, counts, snippets, relations, or notification metadata."
    evidence: "Derived-surface authorisation test meeting INV-CWS-001, INV-CWS-005, and QA-CWS-001."
  - id: "ACC-CWS-005"
    given: "A current page has several attributed revisions including comments and an attachment."
    when: "An editor previews and restores an earlier revision."
    then: "The selected state becomes current through a new attributed revision while the immediately prior state and the restored revision remain inspectable under policy."
    evidence: "Restore-history test meeting REQ-CWS-030, REQ-CWS-031, INV-CWS-004, and QA-CWS-004."
  - id: "ACC-CWS-006"
    given: "A user has a time-limited public share link and an integration has a content grant with an event subscription."
    when: "The link and integration grant are revoked before a new content action."
    then: "The link, direct integration read, API write, and subscribed event delivery are all denied after revocation and events name the revocation result."
    evidence: "Revocation-boundary test meeting REQ-CWS-027, REQ-CWS-046, INV-CWS-008, and QA-CWS-005."
  - id: "ACC-CWS-007"
    given: "A template and public form target a database containing confidential records."
    when: "An untrusted form submitter uses the template and submits valid and invalid values."
    then: "They can create only the declared record or receive validation errors, never inspect another record, template-private data, relation target, or database structure."
    evidence: "Template and form isolation test for REQ-CWS-033 and REQ-CWS-034."
  - id: "ACC-CWS-008"
    given: "An import contains valid records, invalid values, duplicate identifiers, and a relation to a missing target."
    when: "A steward previews and accepts the import."
    then: "The outcome names each accepted, skipped, and rejected item; only validated accepted records are committed and each has provenance and history."
    evidence: "Import review test for REQ-CWS-035 and REQ-CWS-048."
  - id: "ACC-CWS-009"
    given: "An active automation can update a record, notify an assignee, and invoke an external system."
    when: "Its external action times out after dispatch and the final outcome is indeterminate."
    then: "The run is recorded as indeterminate, the external side effect is not retried automatically, and an authorised human can inspect and decide retry or compensation."
    evidence: "Indeterminate-side-effect test meeting REQ-CWS-043, REQ-CWS-044, INV-CWS-007, and QA-CWS-006."
  - id: "ACC-CWS-010"
    given: "An automation lacks share authority and an assistant has content-read scope only."
    when: "The automation attempts to widen its grant and the assistant proposes a publication, permission change, deletion, and external message."
    then: "The grant change is denied and each consequential assistant proposal requires the separately authorised action and required approval before effect."
    evidence: "Non-human authority-escalation test for REQ-CWS-042, REQ-CWS-052, and INV-CWS-007."
  - id: "ACC-CWS-011"
    given: "A workspace policy disables public sharing, webhooks, export of a classified property, and AI requests."
    when: "A steward and an integration attempt those operations through user, API, automation, and assistant paths."
    then: "Every path is denied before disclosure or external dispatch, and the audit log records the policy decision without protected values."
    evidence: "Workspace-egress policy test for REQ-CWS-025, REQ-CWS-053, INV-CWS-009, and POL-CWS-003."
  - id: "ACC-CWS-012"
    given: "A record is changed by a member, an import, an integration, and an automation."
    when: "An authorised steward inspects its history and related automation run."
    then: "Each change identifies its responsible human or non-human identity, source, time, correlation identifier, and permitted detail without exposing masked values."
    evidence: "Cross-origin traceability test meeting REQ-CWS-029, REQ-CWS-043, REQ-CWS-048, and QA-CWS-003."
  - id: "ACC-CWS-013"
    given: "A database property type change would invalidate existing values and an active legal hold covers some records."
    when: "A steward previews the schema migration and an owner attempts to purge held content."
    then: "The migration reports affected records before activation, and the purge is blocked until the hold is explicitly released by authorised policy."
    evidence: "Schema and hold governance test for POL-CWS-008, REQ-CWS-055, and INV-CWS-010."
  - id: "ACC-CWS-014"
    given: "A user with distinct locale and time-zone preferences creates a scheduled automation and a due date."
    when: "Another user in a different time zone views and interacts with them using keyboard and assistive technology."
    then: "Each sees an unambiguous local representation, the scheduled instant remains the same, and the full flow is operable without a pointer."
    evidence: "Locale, time-zone, keyboard, and assistive-technology test for REQ-CWS-057 through REQ-CWS-059 and QA-CWS-008."
  - id: "ACC-CWS-015"
    given: "A workspace owner requests export of a scoped project with pages, databases, attachments, relations, comments, and redacted fields."
    when: "The export is generated and imported into an empty conforming workspace."
    then: "The result preserves the documented portable set, identifies omissions and redactions, and the import reports no unreported loss."
    evidence: "Round-trip portability test meeting REQ-CWS-036 and QA-CWS-007."
  - id: "ACC-CWS-016"
    given: "A clean host with only the documented open-source prerequisites and no vendor credentials, licence key, subscription, or outbound vendor access."
    when: "An operator builds the published source, applies the self-hosted deployment profile, and exercises every must capability."
    then: "All must capabilities operate, the deployment evidence names every dependency and outbound destination, and no mandatory proprietary or paid component is present."
    evidence: "Clean-room freedom and self-hosting conformance test for REQ-CWS-060, REQ-CWS-061, INV-CWS-011, POL-CWS-009, and QA-CWS-009."
  - id: "ACC-CWS-017"
    given: "Two authorised participants start from a synchronised workspace and one edits pages, records, attachments, and comments while disconnected."
    when: "The participant reconnects after the other participant has made overlapping and non-overlapping changes."
    then: "Every accepted local change converges or is presented as an explicit conflict, content remains locally readable during disconnection, and no vendor endpoint is required."
    evidence: "Offline-reconnect and self-hosted-sync test for REQ-CWS-062 through REQ-CWS-064, INV-CWS-012, POL-CWS-010, and QA-CWS-010."
  - id: "ACC-CWS-018"
    given: "The published reference workload and deployment profile with ten concurrent editors, one hundred thousand records, ten thousand pages, and one million blocks."
    when: "The workload performs local editing, connected collaboration, search, offline recovery, indexing, and storage-pressure scenarios."
    then: "The published report meets the p95 edit, search, and propagation targets, reports all required percentile and resource measurements, and preserves durable edits in each degraded scenario."
    evidence: "Reproducible performance and degradation benchmark for REQ-CWS-065 through REQ-CWS-068 and QA-CWS-011."
  - id: "ACC-CWS-019"
    given: "A workspace with documents, structured records, views, schemas, policies, automation definitions, comments, and hash-addressed attachments has accepted local and concurrent edits."
    when: "The editors save, publish, merge, restore, migrate a schema, and complete an approved automation checkpoint."
    then: "Each semantic state is materialised as an attributed Git revision; no individual keystroke becomes a commit; all canonical content and attachment manifests are reachable from the repository; and secrets are absent."
    evidence: "Git-materialisation conformance test for REQ-CWS-069 through REQ-CWS-071, INV-CWS-014, INV-CWS-015, POL-CWS-011, POL-CWS-012, and QA-CWS-013."
  - id: "ACC-CWS-020"
    given: "A valid canonical repository and independently deleted search index, relational projection, cache, collaboration relay, and attachment object."
    when: "An operator rebuilds each derived service and a contributor pushes an invalid direct repository revision."
    then: "Each derived service rebuilds from the repository and manifests without canonical loss; the missing attachment remains explicit; and the invalid revision is inspectable but never exposed as current workspace state."
    evidence: "Derived-store reconstruction and direct-Git-validation test for REQ-CWS-072 through REQ-CWS-074 and QA-CWS-014."
  - id: "ACC-CWS-021"
    given: "An owner has a public-key authenticator and a second factor, two active sessions on distinct devices, and an account with access to protected workspace content."
    when: "The owner loses one device, revokes its authenticator and session, then the account is suspended and later reactivated under policy."
    then: "The affected and suspended sessions fail before every subsequent protected operation, remaining sessions can be inspected and terminated, reactivation does not restore revoked credentials, and all actions have redacted security events."
    evidence: "Identity, session-containment, and audit test for REQ-CWS-079 through REQ-CWS-081, REQ-CWS-084, INV-CWS-016, INV-CWS-017, QA-CWS-015, and QA-CWS-016."
  - id: "ACC-CWS-022"
    given: "An attacker repeatedly attempts unknown and known accounts, a recovery attempt, a password or factor replacement, and an administrator-role change from a valid but low-assurance session."
    when: "The attempts cross the configured abuse thresholds and the legitimate participant performs the sensitive changes."
    then: "Unauthenticated responses reveal no account or recovery existence, abuse controls and notifications occur, sensitive changes require the configured step-up factor, recovery is time-bounded and attributable, and no secret appears in Git, export, logs, or audit evidence."
    evidence: "Authentication-abuse, step-up, recovery, and secret-exclusion test for REQ-CWS-076 through REQ-CWS-078, REQ-CWS-082, REQ-CWS-083, POL-CWS-013, and POL-CWS-014."

