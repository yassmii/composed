schema_version: "0.1"
research_status: "initial"
candidate_products: ["Notion", "Airtable", "AppFlowy", "AFFiNE", "Docmost", "Anytype", "Any"]
source_selection:
  - "Notion is the primary reference because it combines block documents, databases, collaborative editing, workspace sharing, automation, integrations, governance, and export in one product."
  - "Airtable is a comparison reference for operational databases, automation run history, interfaces, snapshots, and record-level history."
  - "AppFlowy, AFFiNE, and Docmost are open-source or open-core alternatives examined for the boundary between self-hosting, collaboration, customisation, and licensing. Their immutable source files are pinned to exact commits."
  - "Anytype is included as a counter-example: it demonstrates local-first encrypted collaboration but its application client is source-available rather than open source. Any is included as a permissively licensed, local-first collaborative building-block reference, not as a finished end-user workspace."
  - "OWASP ASVS 5.0.0 is used as a versioned primary security reference for authentication and session controls. It informs the contract's testable security boundary; specific factor and policy choices remain marked in traceability."
  - "All sources are first-party help or support articles fetched on 2026-10-14. The content SHA-256 is the fetched response body at the listed URL, except entries explicitly marked `html_article_text`, which hash the canonical text of the primary article to exclude CDN scripts and navigation chrome; mutable documentation still produces a detectable content drift."
