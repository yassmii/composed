delivery:
  required_artifacts:
  - Matrice clauses → cas et résultats réellement exécutés, avec identités des versions évaluées.
  - Modèle de données, conventions de calcul et profils de service/domaine documentés, sans stack imposée.
  - Jeu synthétique de référence comprenant bilan, budget, scénarios, conseil, refus et suivi.
  - Rapports de référence lisibles, historique de validation/remise et preuve de restauration contrôlée.
  - Registre des modèles fiscaux, successoraux et de retraite effectivement couverts, leurs sources, validités
    et limites.
  - Règles d’accès, finalités, conservation, exportation et suppression, avec conditions d’exploitation du
    cabinet.
  verification:
  - Exécuter les cas positifs, de limite et de refus déclarés sur une révision identifiée ; conserver les résultats
    manquants ou bloqués.
  - Comparer les calculs aux valeurs attendues établies indépendamment du candidat et faire revoir les modèles
    métier par une personne compétente.
  - Revoir humainement la lisibilité, l’adéquation du périmètre et les limites réglementaires avant toute revendication
    de préparation à l’exploitation.
  - Ne pas présenter validation structurelle, revue d’auteur ou fixtures comme preuve d’usage, certification
    réglementaire ou acceptation client.
