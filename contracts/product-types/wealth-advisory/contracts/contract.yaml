delivery:
  required_artifacts:
  - Matrix of clauses → cases and results actually executed, with the identities of the versions evaluated.
  - Data model, calculation conventions and service/domain profiles documented, without an imposed stack.
  - Synthetic reference dataset comprising balance sheet, budget, scenarios, advice, refusals and follow-up.
  - Readable reference reports, validation/delivery history and evidence of controlled restoration.
  - Register of the tax, inheritance and retirement models actually covered, their sources, validity periods
    and limits.
  - Rules for access, purposes, retention, export and deletion, with the operating conditions of the firm.
  verification:
  - Execute the declared positive, boundary and refusal cases on an identified revision; keep the missing
    or blocked results.
  - Compare the calculations with expected values established independently of the candidate and have the
    business models reviewed by a competent person.
  - Review by a human the readability, the appropriateness of the scope and the regulatory limits before any
    claim of readiness for operation.
  - Do not present structural validation, author review or fixtures as evidence of use, regulatory certification
    or client acceptance.
