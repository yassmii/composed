schema_version: '0.2'
id: wealth-advisory
name: Wealth analysis and advice — France
version: 0.1.1
kind: product-contract
status: draft
license: CC-BY-4.0
intent:
  promise: Enable a wealth manager (gestionnaire de patrimoine) to build, explain and follow up advice
    based on the situation and objectives of their client.
  primary_outcome: A dated and attributed report links information, balance sheet, diagnosis, scenarios,
    validated recommendations and follow-up without hiding the unknowns or the limits of the advice.
  success_metrics:
  - id: MET-WAD-001
    measure: Observe in real use whether the adviser can retrieve the data and assumptions justifying each
      recommendation; population, period and target to be defined during the pilot.
  - id: MET-WAD-002
    measure: Observe balance-sheet corrections, misunderstandings of the report and missed follow-up actions;
      no comparative improvement or numerical target is presumed.
scope:
  includes:
  - Engagement, relevant client knowledge and objectives.
  - Inventory of assets, liabilities, ownership rights, income and expenses.
  - Diagnosis, compared scenarios and models declared per domain.
  - Reasoned recommendations, human validation, retainable report and attributed delivery.
  - Action plan, re-examination of the advice, confidentiality and data lifecycle.
  excludes:
  - Anti-money-laundering and counter-terrorist-financing (lutte contre le blanchiment de capitaux et le
    financement du terrorisme, LCB-FT) monitoring arrangements, sanctions screening and asset freezing
    (gel des avoirs); planned for a later evolution.
  - Execution of transactions, reception and transmission of orders (réception-transmission d’ordres),
    subscriptions and signature of legal acts.
  - Overall certification of the firm or of the software under French law; checking of professional
    authorisation (habilitation) by an authority.
  - Implicit coverage of every tax, inheritance or international situation or of every legal person
    (personne morale).
  - Choice of architecture, stack, data provider, transport or validation tool.
actors:
- id: ACT-WAD-ADVISER
  name: Responsible adviser
  goals:
  - Analyse the situation and take responsibility for justified advice within their scope.
  permissions:
  - Prepare, review, validate and deliver the advice for authorised files; decide on the follow-up.
- id: ACT-WAD-ASSISTANT
  name: Firm assistant
  goals:
  - Prepare and update the authorised information.
  permissions:
  - Enter and document the authorised files without validating or delivering advice in the capacity of
    responsible adviser.
- id: ACT-WAD-CLIENT
  name: Client or person concerned
  goals:
  - Understand the advice and decide what action to take on it.
  permissions:
  - Receive the information intended for them, express their answers and decisions, exercise their rights
    according to the processing; no mandatory client portal.
- id: ACT-WAD-ADMIN
  name: Access and data manager
  goals:
  - Manage access rights (habilitations), retention and the authorised continuity operations.
  permissions:
  - Administer the assigned scope; no reading of advice data by default.
domain:
  entities:
  - id: ENT-WAD-MISSION
    name: Engagement
    description: Attributed service (mission) with scope, service conditions and versions.
    lifecycle:
    - prepared
    - agreed
    - in progress
    - closed
  - id: ENT-WAD-PERSON
    name: Person and analysed group
    description: Identities, relationships and consolidation scope; an analysed group does not automatically
      define a tax household (foyer fiscal).
    lifecycle:
    - recorded
    - updated
    - removed from scope
  - id: ENT-WAD-INVENTORY
    name: Wealth item or flow
    description: Sourced and dated asset, right, debt, commitment, income or expense.
    lifecycle:
    - declared
    - documented
    - to be confirmed
    - replaced
  - id: ENT-WAD-GOAL
    name: Objective
    description: Outcome sought, holder, priority, horizon and constraints.
    lifecycle:
    - expressed
    - prioritised
    - revised
    - abandoned
    - declared achieved
  - id: ENT-WAD-SCENARIO
    name: Scenario and calculation
    description: Reference and strategy under versioned data, models and assumptions.
    lifecycle:
    - draft
    - calculated
    - to be recalculated
    - retained
  - id: ENT-WAD-ADVICE
    name: Advice and report
    description: Reasoned recommendations and readable revision whose author takes responsibility for
      the validation.
    lifecycle:
    - proposed
    - to be reviewed
    - validated
    - delivered
    - replaced
    - withdrawn
  - id: ENT-WAD-ACTION
    name: Follow-up action
    description: Decision or task linked to the delivered advice with a person responsible and a due date.
    lifecycle:
    - to be decided
    - accepted
    - refused
    - in progress
    - completed
    - abandoned
  - id: ENT-WAD-RECORD
    name: Evidence and event
    description: Source, validation, delivery or decision attributed and retained according to an explicit
      purpose.
    lifecycle:
    - recorded
    - active retention
    - restricted retention
    - deleted
  glossary:
  - term: Wealth manager (gestionnaire de patrimoine)
    definition: Business user; this title alone determines neither regulatory status nor professional
      authorisation (habilitation).
  - term: Covered scope
    definition: Persons, domains, periods, models and services explicitly included in an engagement.
  - term: Net wealth
    definition: Sum of the assets and rights retained, less the debts allocated, in a stated currency and
      scope.
  - term: Suitability (adéquation)
    definition: Reasoned assessment of a recommendation in the domain and service regime concerned; this
      word does not certify the whole service.
  - term: Analysis date
    definition: Reference date of the situation observed, distinct from the dates of collection, valuation,
      simulation and delivery.
  - term: Revision
    definition: Identifiable state of a file, calculation or advice; a modification does not relabel the
      evidence of the previous state.
capabilities:
- id: CAP-WAD-001
  name: Engagement and scope of the advice
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: An attributed engagement describes the analyses and advice actually covered.
  requirements:
  - id: REQ-WAD-001
    statement: Each engagement identifies the persons concerned, the responsible adviser, the service
      objectives, the domains covered, the exclusions, the method of remuneration and any declared conflicts
      of interest. Professional statuses and authorisations (habilitations) are recorded separately from
      the title of wealth manager (gestionnaire de patrimoine); declaring them in the product does not
      amount to verification by an authority.
  - id: REQ-WAD-002
    statement: 'The advice scope and its entry conditions are versioned per domain: financial, insurance,
      real estate, taxation, wealth transfer (transmission) and retirement. A recommendation outside the
      declared scope or professional authorisations (habilitations) can be neither validated nor presented
      as covered advice; a need outside the scope is referred to an identified professional or explicitly
      left untreated. At least one advice domain is actually covered; an empty profile does not satisfy
      this contract.'
- id: CAP-WAD-002
  name: Client discovery and objectives
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: The adviser has a fact-find (recueil) that is dated, consistent and proportionate to the engagement.
  requirements:
  - id: REQ-WAD-003
    statement: The fact-find (recueil) covers the relevant personal, family, professional and tax situation,
      the dependants and the ownership links necessary for the engagement. Each important answer carries
      its source, its collection date, its effective date if known and its state of declared, documented,
      to be confirmed or unknown; a supporting document is not mandatory for every answer.
  - id: REQ-WAD-004
    statement: Each objective is attributed to a named person or group and includes a priority, a horizon,
      an amount or an explicit qualitative measure, the liquidity needs and the declared constraints. Incompatible
      objectives and trade-off decisions remain visible; no priority is silently inferred.
  - id: REQ-WAD-005
    statement: Before the validation of advice on financial investment or on life insurance or capitalisation
      contracts (assurance-vie/capitalisation), the file contains the relevant information on knowledge
      and experience, financial situation, capacity to bear losses, objectives and horizons, risk tolerance
      and sustainability preferences, with their dated answers and with inconsistencies resolved. The
      list of required information and its freshness depend on the declared service profile; a refusal
      to answer, a missing datum or an incomplete profile never amounts to a favourable answer.
- id: CAP-WAD-003
  name: Wealth inventory
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: Assets and commitments are attributed and valued without double counting.
  requirements:
  - id: REQ-WAD-006
    statement: Each asset identifies its category, its holders, the form of ownership and the relevant
      rights, its gross value, its currency, its valuation date, its provenance and its level of uncertainty.
      Each debt identifies the debtors, the dated outstanding principal, the known repayment conditions
      and its link, if any, to an asset. Unknown amounts and guarantees given are distinguished from certain
      values and debts.
  - id: REQ-WAD-007
    statement: Aggregates display the scope of persons and rights, the valuation shares retained and the
      debt allocation rules explicitly recorded. An undivided co-ownership (indivision) or a shareholding
      is apportioned according to these data; a split of ownership into usufruct and bare ownership (démembrement),
      a community of property between spouses (communauté) or joint and several liability (solidarité)
      is not treated as an automatic equal division. A valuation of rights that is not covered is flagged
      and excluded from the numerical total concerned, which becomes partial.
    depends_on:
    - INV-WAD-002
  - id: REQ-WAD-008
    statement: An asset is counted only once in each aggregate. A wrapper (enveloppe) and its underlying
      investment vehicles (supports), or a shareholding and the underlying property, may be detailed together,
      but their values are not added up as independent assets. The balance sheet presents assets retained,
      liabilities allocated and net wealth equal to their difference; any exclusion or inconsistency that
      changes the scope is visible.
    depends_on:
    - REQ-WAD-007
    - REQ-WAD-009
  - id: REQ-WAD-009
    statement: A monetary aggregate states its currency and its analysis date. Foreign values keep their
      original amounts and use a sourced and dated conversion rate that is explicitly selected; a missing
      rate does not become 1. Earlier values remain dated and an explicit freshness rule flags those to
      be updated; a future value is not used as an observation at a past date.
- id: CAP-WAD-004
  name: Wealth and budget diagnosis
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: The diagnosis sets out its calculations, its limits and its link with the objectives.
  requirements:
  - id: REQ-WAD-010
    statement: Income, expenditure, known taxes and debt repayments carry an amount, a periodicity, an
      effective period and a gross/net qualification. The budget brings the flows to a common period according
      to a visible convention and distinguishes recurring flows from exceptional ones. A debt instalment
      included in the expenses is not subtracted twice; the available balance may be negative and is not
      automatically treated as savings actually observed.
  - id: REQ-WAD-011
    statement: The diagnosis presents at least the composition of the wealth, the liquidity and the known
      restrictions on availability (indisponibilités), the exposure to debts and the budget in relation
      to the objectives. Each ratio states its numerator, denominator, period and limits; a zero denominator
      or a missing indispensable datum gives not calculable. No overall risk ranking is invented from the
      category of an asset alone.
  - id: REQ-WAD-012
    statement: Each finding links the items and objectives on which it is based, the missing or contradictory
      data and the points requiring expertise. The adviser can document, explain and resolve an inconsistency
      without erasing the initial answer or value retained in the applicable history.
- id: CAP-WAD-005
  name: Comparable scenarios and simulations
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: Strategies are compared with a reference situation under explicit assumptions.
  requirements:
  - id: REQ-WAD-013
    statement: Each simulation identifies the revision of the reference file, the horizon, the operations
      envisaged, the return, inflation, fee and tax assumptions used or their explicit exclusion, as well
      as the models, sources and validity periods. Every quantified strategy is compared with maintaining
      the reference situation on a common calculation basis, or sets out the differences that prevent
      this comparison.
    depends_on:
    - INV-WAD-003
  - id: REQ-WAD-014
    statement: The results separate flows, value of the wealth and objective indicators; they set out the
      favourable and unfavourable effects of the relevant assumptions, in particular return, liquidity
      and fees. A projection is never a guaranteed result; a probabilistic success rate is displayed only
      if its method and its limits are documented.
  - id: REQ-WAD-015
    statement: A tax, inheritance or retirement calculation is usable as a covered result only if its domain,
      its jurisdiction, its period, its rules and its limits are identified and its model has reference
      cases reviewed by a competent professional. A model that is absent, out of date for the period or
      outside the domain produces an unavailable result, without silent reuse of a neighbouring rule. A
      manual external estimate remains distinct, sourced and subject to review.
- id: CAP-WAD-006
  name: Reasoned recommendations
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: The adviser formulates and justifies advice suited to the current file.
  requirements:
  - id: REQ-WAD-016
    statement: Each recommendation carries an author, a date, an objective, the findings and scenarios
      used, the relevant client data, the benefits sought, risks, liquidity constraints, known and unknown
      fees, tax effects covered or not covered and the reservations. Maintaining the existing situation
      or an alternative solution is examined; if only one option is relevant, the adviser explains the
      reason.
  - id: REQ-WAD-017
    statement: For a recommendation on an identified instrument or contract, the characteristics and reference
      documents are dated and compared against the objectives, knowledge, experience, risk tolerance, capacity
      for loss and relevant preferences of the client. An unresolved incompatibility or a missing required
      datum blocks the validation. The target market (marché cible) is examined where it applies; the absence
      of a relevant reference framework prevents concluding that this check has been made.
    depends_on:
    - REQ-WAD-002
    - REQ-WAD-005
  - id: REQ-WAD-018
    statement: The reasons for the choice set out the alternatives discarded and the fees and remuneration
      links likely to influence the advice. A remuneration or a commercial advantage cannot replace the
      justification of the choice in relation to the client. A preference of the client for an incompatible
      option is recorded without automatically making that option suitable.
  - id: REQ-WAD-019
    statement: Formalised financial advice explains the suitability (adéquation) for the situation and
      the objectives; insurance advice explains the consistency with the demands and needs (exigences et
      besoins) and, for a personalised recommendation, the choice between options. The presentation distinguishes
      these obligations according to the domain instead of using a universal attestation of conformity.
- id: CAP-WAD-007
  name: Validation and delivery of the report
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: The delivered report corresponds exactly to advice reviewed by the adviser responsible for it.
  requirements:
  - id: REQ-WAD-020
    statement: Only a human adviser holding the declared role and scope can validate a revision of the
      advice. The validation is attributed, dated and linked to the versions of the file, calculations,
      models and documents used. A relevant modification after validation requires a new review before
      delivery of the modified revision; the historical revision remains identifiable. The reviewed version
      is checked at the time of validation and of delivery; a decision based on a superseded version is
      refused even in the event of a concurrent modification.
    depends_on:
    - INV-WAD-006
  - id: REQ-WAD-021
    statement: A readable and retainable report presents the engagement, the date and scope of analysis,
      the balance sheet, the objectives, the findings, the scenarios retained, the reasoned advice, its
      risks, fees, assumptions and reservations, the author and the next actions. An extract or an export
      keeps the limits and references necessary for its interpretation. A draft carries that status and
      cannot be delivered as validated advice.
  - id: REQ-WAD-022
    statement: The delivery is recorded with the authorised recipient, the date, the exact identity of
      the revision and the means of delivery. An unconfirmed or failed delivery remains distinct from an
      established delivery. Receipt, agreement of the client, refusal of the client and implementation
      are distinct events; none is inferred from the mere download or production of the report.
    depends_on:
    - REQ-WAD-020
    - REQ-WAD-021
- id: CAP-WAD-008
  name: Advice follow-up and re-examination
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: The follow-up links the actions and changes to the advice actually delivered.
  requirements:
  - id: REQ-WAD-023
    statement: An action plan links each action to a recommendation and states the person responsible,
      due date, status and supporting document or comment. The states to be decided, accepted, refused,
      in progress, completed and abandoned remain distinct; completion is declared with its provenance
      and does not by itself prove that the objective has been achieved.
  - id: REQ-WAD-024
    statement: The follow-up service states its extent, its triggers, its due-date rule and the obligations
      applicable per domain. The system flags due dates reached and declared changes of situation, objectives,
      products or models that require a review. Silence from the client or an absence of connection amounts
      neither to an update nor to a confirmation of suitability (adéquation). For a financial investment
      adviser (conseiller en investissements financiers, CIF) service of periodic assessment of suitability,
      the rule provides for at least an annual examination and an increased frequency if the risk or the
      instruments require it; this periodicity does not automatically apply to the other domains.
  - id: REQ-WAD-025
    statement: During a review, the adviser retrieves the last revision delivered, the actions and the
      changes since that revision. They record the new information or the refusal to provide it, the decision
      to maintain, modify, suspend or stop the advice and the next due date. A new recommendation requires
      a new validation and delivery without rewriting the initial opinion.
    depends_on:
    - REQ-WAD-024
    - REQ-WAD-020
- id: CAP-WAD-009
  name: Confidentiality and control of data
  priority: must
  actor: ACT-WAD-ADVISER
  outcome: Advice data and evidence remain limited to the authorised persons and uses.
  requirements:
  - id: REQ-WAD-026
    statement: Access authorisations are evaluated at each read, modification and export according to the
      firm, the file, the role and the person concerned. An assistant prepares the data without validating
      the advice; a technical administrator does not obtain, by their role alone, a right to read the files.
      Refusals reveal neither the data nor the existence of an unauthorised file.
  - id: REQ-WAD-027
    statement: Collection associates the categories of data with their purpose and distinguishes necessary
      information from optional information. A refusal of optional collection does not block a service
      that does not depend on it. No transmission to a third party, including external automated assistance,
      occurs without a destination and purpose authorised within the scope of the processing.
  - id: REQ-WAD-028
    statement: Creations, changes, validations, deliveries and follow-up decisions are attributed and dated
      without logging secrets or copying the documents or the complete balance sheet into the technical
      logs. Consultation of this history follows the same authorisations as the file. The rules for retention,
      rectification, export of personal data and deletion are documented per category and purpose, with
      a reason and an end date for any applicable restricted retention.
  - id: REQ-WAD-029
    statement: The file, its authorised history and the retained reports can be exported in a documented
      and intelligible format. A controlled restoration re-establishes the versions, links and authorisations;
      a failure of backup, export or restoration is reported without claiming a complete result. An authorised
      deletion covers the derived data and prevents their reappearance from a backup according to the documented
      restoration procedure.
invariants:
- id: INV-WAD-001
  statement: A datum that is unknown, refused or not applicable remains distinct from zero, from no and
    from a validated value.
  rationale: An absence must not artificially improve the balance sheet or the suitability.
- id: INV-WAD-002
  statement: The rights and debts retained in a total are explicitly attributed; the same economic interest
    is never counted twice in it.
  rationale: Preserve consistency between detail, person and analysed group.
- id: INV-WAD-003
  statement: Every numerical result remains linked to its dated data, its currency, its method and its
    assumptions.
  rationale: A figure without scope or provenance does not allow an explainable decision.
- id: INV-WAD-004
  statement: A delivered revision is never modified in place; its history remains accessible only during
    its authorised retention. A legitimate rectification or deletion follows a distinct, traced operation.
  rationale: Reconcile the traceability of the advice with the control of personal data.
- id: INV-WAD-005
  statement: An assumption, a finding, a proposal, validated advice, a client agreement and a completed
    action are different states.
  rationale: Avoid presenting a simulation or a suggestion as advice or as an executed operation.
- id: INV-WAD-006
  statement: Automated assistance can neither attribute to itself the capacity of responsible adviser,
    nor validate advice, nor declare the agreement of a client.
  rationale: Responsibility and human decisions remain attributed.
- id: INV-WAD-007
  statement: Access limits also apply to exports, searches, histories, consultable backups and derived
    results.
  rationale: An auxiliary view must not circumvent the confidentiality of a file.
- id: INV-WAD-008
  statement: No simulated return, diagnosis or software score is presented as a guarantee of result or
    a regulatory certification.
  rationale: Distinguish a calculation, an advice decision and the results actually obtained.
policies:
- id: POL-WAD-001
  decision: The first version covers the advice journey of natural persons and named groups supported in
    France; it requires an explicit scope for each domain and each engagement.
  consequence: Legal persons (personnes morales) can be described as holding entities; advice to them in
    their own right, cross-border situations not covered and undeclared models are referred or marked
    out of scope.
- id: POL-WAD-002
  decision: The modules for anti-money-laundering and counter-terrorist-financing (LCB-FT) monitoring and
    for asset freezing (gel des avoirs) are deferred, as are order execution and subscriptions.
  consequence: The product issues no LCB-FT or asset-freezing compliant status and does not claim to release
    the firm from its obligations or to replace its existing arrangements.
- id: POL-WAD-003
  decision: Automated assistance is optional and produces only proposals attributed to that assistance.
  consequence: The journey remains achievable without it; a proposal that is retained is the subject of
    an explicit decision by the adviser and of the same controls as advice entered manually.
- id: POL-WAD-004
  decision: A partial file can produce a partial balance sheet or diagnosis that is explicitly marked;
    it does not allow validating advice for which a required condition is missing.
  consequence: Non-blocking reservations and blocking conditions are distinguished according to the service
    profile; a generic warning does not lift a block.
- id: POL-WAD-005
  decision: Follow-up due dates are defined by the agreed service and its applicable obligations, not by
    an invented uniform periodicity.
  consequence: The rule, its source, its version, its effective date and its starting event are retained
    and overdue actions remain visible until their attributed handling.
quality_attributes:
- id: QA-WAD-001
  attribute: Accuracy and reproducibility of calculations
  target: For the reference cases, details and totals reconcile to the cent according to a declared rounding
    convention. The same data and versions reproduce the same results; each conversion and rounding is
    explainable.
- id: QA-WAD-002
  attribute: Continuity and integrity
  target: A restoration exercise on a fixture retrieves the retained advice revisions and their links with
    the data, validations, deliveries and authorisations, without reintroducing data subject to an authorised
    deletion.
- id: QA-WAD-003
  attribute: Understanding of the report
  target: On the reference reports, a business reader finds, without internal codes, the date, scope, objective,
    assumptions, risks, fees, reservations, human decision and next actions. The expected items and the
    difficulties observed are recorded; this review does not demonstrate client adoption.
integrations: []
acceptance:
- id: ACC-WAD-001
  given: An engagement with an adviser declared for one domain, an excluded domain and a file of natural
    persons.
  when: Prepare and then attempt to validate advice in each of the two domains and advice to a legal person
    (personne morale) in its own right.
  then: The scope and the engagement conditions are retrievable; only the explicitly covered domain is
    admissible, the other requests are blocked or referred without an invented compliance status.
  evidence: Engagement read back and observations of the validations admitted/refused with their reasons.
  verifies:
  - REQ-WAD-001
  - REQ-WAD-002
  - POL-WAD-001
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - negative
- id: ACC-WAD-002
  given: A known family datum, an unknown datum, a refused answer and a dated document.
  when: Record and then read back the fact-find (recueil) and a partial balance sheet.
  then: The states, sources and dates are kept; an unknown becomes neither zero nor a confirmed answer
    and the balance sheet reveals its limits.
  evidence: Fact-find read back and partial presentation with the expected states.
  verifies:
  - REQ-WAD-003
  - INV-WAD-001
  - POL-WAD-004
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - negative
- id: ACC-WAD-003
  given: Two contradictory objectives, one of short-term liquidity and one of long-term locked-up investment.
  when: Record their holders, amounts, horizons, priorities and an explicit trade-off decision.
  then: The initial conflict remains identifiable and only the recorded trade-off decision changes the
    priority; no automatic priority replaces the choice.
  evidence: Objectives and history before/after the trade-off decision.
  verifies:
  - REQ-WAD-004
  - REQ-WAD-012
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - negative
- id: ACC-WAD-004
  given: An investment advice service profile and a file in which the capacity for loss or a required sustainability
    answer is missing.
  when: Attempt to validate a recommendation, then complete the answers and deal with the inconsistencies.
  then: The first validation is refused with the missing conditions; the second is admissible only if all
    the relevant conditions are satisfied, with retrievable answers and versions.
  evidence: Results of the two attempts and the entry-conditions profile used.
  verifies:
  - REQ-WAD-005
  - REQ-WAD-017
  - POL-WAD-004
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - negative
- id: ACC-WAD-005
  given: A property of 400,000 EUR held 60/40, a debt of 100,000 EUR explicitly allocated 60/40, a wrapper
    (enveloppe) of 50,000 EUR detailed into underlying investment vehicles (supports) totalling 50,000
    EUR.
  when: Calculate the individual and consolidated balance sheets at the same dates and rights.
  then: The group presents 450,000 EUR of assets, 100,000 EUR of debts and 350,000 EUR net. Excluding the
    wrapper, which is attributed separately, the shares of the net property are 180,000 and 120,000 EUR;
    the underlying investment vehicles do not double the wrapper.
  evidence: Details of the owners/debtors, calculations and reconciliation with the expected values.
  verifies:
  - REQ-WAD-006
  - REQ-WAD-007
  - REQ-WAD-008
  - INV-WAD-002
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - boundary
- id: ACC-WAD-006
  given: A split of ownership into usufruct and bare ownership (démembrement) without a model for valuing
    the rights, a debt without allocation and a guarantee that has not been called.
  when: Request a total per person.
  then: The items that cannot be attributed are flagged; no 50/50 split and no certain debt for the guarantee
    is invented and the total concerned is marked partial.
  evidence: Inventory and partial balance sheet with reasoned exclusions.
  verifies:
  - REQ-WAD-006
  - REQ-WAD-007
  - INV-WAD-001
  - INV-WAD-002
  verification:
    methods:
    - automated
    boundary: public-interface
    case_kinds:
    - positive
    - negative
- id: ACC-WAD-007
  given: A position of 1,000 USD, a documented rate of 0.90 EUR/USD and an analysis date earlier than another
    available valuation.
  when: Calculate with this rate and then without a rate, and examine the values retained.
