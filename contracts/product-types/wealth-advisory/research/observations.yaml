schema_version: '0.1'
observations:
- id: OBS-WAD-BIG-INPUT
  sources:
  - SRC-PA-BIG-GUIDE
  statement: Big’s guided entry (saisie guidée) describes personal/family situation, wealth and budget, with
    a summary before the file is created.
- id: OBS-WAD-BIG-SCOPE
  sources:
  - SRC-PA-BIG
  statement: Harvest presents Big as a tool for overall or thematic studies, for simulating recommendations
    and for producing personalised reports; this page does not establish the accuracy of its calculations.
- id: OBS-WAD-RC-BALANCE
  sources:
  - SRC-PA-RIGHTCAPITAL
  statement: RightCapital documents an assets/liabilities/net balance sheet, details by category and owner,
    an update date and a history; its taxonomy remains tied to the American context.
- id: OBS-WAD-MG-GOALS
  sources:
  - SRC-PA-MONEYGUIDE
  statement: MoneyGuide describes goal-based plans with risk management, allocation and income; this description
    does not establish the applicability of its rules to French law.
- id: OBS-WAD-AMF-SCOPE
  sources:
  - SRC-PA-AMF-CIF
  statement: The AMF page distinguishes investment advice from portfolio management and describes the client
    fact-find (recueil), the engagement letter (lettre de mission) and the suitability statement (déclaration
    d’adéquation) specific to the financial investment adviser (conseiller en investissements financiers,
    CIF); the title of wealth management adviser (conseiller en gestion de patrimoine, CGP) is not a universal
    professional authorisation (habilitation).
- id: OBS-WAD-AMF-DATA
  sources:
  - SRC-PA-AMF-CIF
  statement: The AMF describes the collection of objectives, financial situation, knowledge, experience,
    risk tolerance and capacity to bear losses; the absence of the necessary information requires abstaining
    from investment advice.
- id: OBS-WAD-CNIL-PURPOSE
  sources:
  - SRC-PA-CNIL
  statement: The CNIL recalls the precise purpose and the limitation of data to what is necessary.
- id: OBS-WAD-CNIL-RIGHTS
  sources:
  - SRC-PA-CNIL
  statement: The CNIL distinguishes retention period, access limited to authorised persons and the rights
    of individuals.
- id: OBS-WAD-AMF-EXPIRED
  sources:
  - SRC-PA-AMF-HISTORICAL
  statement: The DOC-2013-02 page indicates the end of applicability after 11 October 2022 and the absence
    of a MiFID II (MIF 2) update; this former position grounds no current obligation of this contract.
- id: OBS-WAD-AMF-SUITABILITY
  sources:
  - SRC-PA-AMF-RG
  statement: Article 325-17 requires reasons for suitability (adéquation), including sustainability; its
    paragraph II provides for an examination at least annually if the financial investment adviser (conseiller
    en investissements financiers, CIF) provides a periodic assessment, more frequent according to risk
    and instruments.
