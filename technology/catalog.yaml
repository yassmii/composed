    sources:
      - id: aspnet-overview
        url: https://learn.microsoft.com/en-us/aspnet/core/overview?view=aspnetcore-10.0
        scope: Provides an HTTP middleware pipeline, dependency injection, configuration
          and web API facilities.
      - id: aspnet-signalr
        url: https://learn.microsoft.com/en-us/aspnet/core/signalr/introduction?view=aspnetcore-10.0
        scope: SignalR provides connection management and server-to-client messaging
          with multiple transports; collaboration semantics are application
          work.
    capabilities:
      - id: http-pipeline
        kind: native
        statement: Provides an HTTP middleware pipeline, dependency injection,
          configuration and web API facilities.
        sources:
          - aspnet-overview
      - id: signalr
        kind: extension
        statement: SignalR provides connection management and server-to-client messaging
          with multiple transports; collaboration semantics are application
          work.
        sources:
          - aspnet-signalr
    assessment:
      advantages:
        - An integrated HTTP application model suits a C# team.
      limitations:
        - SignalR transport does not supply CRDT convergence, offline durability
          or canonical Git commits.
      fit:
        - Transactional web services, server-rendered applications and
          self-hosted real-time endpoints.
      avoid:
        - Treating built-in authentication or live transport as proof of
          authorization correctness.
      operations:
        - Plan request limits, connection draining, session revalidation and
          persistent key management.
      costs:
        - Account for workers, database operations and live-connection scale-out
          when needed.
      compatibility:
        - Align runtime and package majors; verify client protocols, reverse
          proxy and database provider support.
      unknowns:
        - No SignalR/Yjs binding or multi-instance revocation protocol has been
          tested.
  - id: ef-core
    name: Entity Framework Core
    category: library
    version_scope: EF Core transaction documentation; relational provider
      capabilities are version-specific.
    review_owner: composed-maintainers
    review_status: documentation-reviewed
    reviewed_on: 2026-11-18
    review_due: 2026-12-18
    license:
      status: unverified
      declared: MIT
      source: https://raw.githubusercontent.com/dotnet/efcore/main/LICENSE.txt
      note: Listed upstream terms inspected; exact distribution, runtime and
        dependency obligations remain project-specific and unaudited.
    sources:
      - id: ef-transactions
        url: https://learn.microsoft.com/en-us/ef/core/saving/transactions
        scope: With a transaction-capable provider, one SaveChanges call is
          transactional; explicit transactions can group multiple operations.
    capabilities:
      - id: transactions
        kind: native
        statement: With a transaction-capable provider, one SaveChanges call is
          transactional; explicit transactions can group multiple operations.
        sources:
          - ef-transactions
    assessment:
      advantages:
        - A .NET team can coordinate persistence and domain changes with
          explicit transaction scopes.
      limitations:
        - A SaveChanges transaction does not by itself prevent last-seat races;
          execution strategies and manual transactions need deliberate
          coordination.
      fit:
        - Relational .NET applications with a supported provider.
      avoid:
        - Assuming all providers implement identical transaction or migration
          semantics.
      operations:
        - Keep transactions short; inspect SQL, retries and connection pools;
          stage schema migrations.
      costs:
        - Budget query tuning and provider upgrades rather than treating the ORM
          as a database replacement.
      compatibility:
        - For PostgreSQL select a compatible Npgsql EF provider; check
          provider/EF/runtime versions together.
      unknowns:
        - No selected provider, migration or concurrency strategy has been
          executed.
  - id: rust
    name: Rust
    category: language
    version_scope: Ownership documentation; pin rustc toolchain, edition and
      dependency minimum supported Rust versions.
    review_owner: composed-maintainers
    review_status: documentation-reviewed
    reviewed_on: 2026-11-18
    review_due: 2026-12-18
    license:
      status: unverified
      declared: Apache-2.0 OR MIT with third-party exceptions
      source: https://raw.githubusercontent.com/rust-lang/rust/master/COPYRIGHT
